[package]
name = "selara-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS shell traits for hotkeys, selection, and clipboard"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
arboard = "3"
cocoa = "0.26"
core-foundation = "0.10"
core-graphics = "0.25"
global-hotkey = "0.8"
objc = "0.2"
tracing.workspace = true

# `objc`'s `msg_send!` / `class!` macros expand `cfg(feature = "cargo-clippy")`
# into this crate, which rustc flags as an unexpected cfg value. Declare it so
# the macOS FFI modules lint clean.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
