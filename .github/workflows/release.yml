name: Release

# Semantic versioning via release-please. Commit types drive the bump:
#   feat  -> minor        fix / perf -> patch        "type!:" or BREAKING CHANGE -> major
# (while the project is 0.x, a breaking change bumps the minor version instead).
#
# On every push to main, release-please keeps one "chore(main): release X.Y.Z"
# pull request open with the version bump and CHANGELOG. Merging that PR
# creates the vX.Y.Z tag and the GitHub Release, and this workflow then
# attaches the macOS CLI binary.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a fine-grained PAT (contents + pull-requests: write) lets
          # CI run on the release PR. Falls back to GITHUB_TOKEN, whose commits
          # do not trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml but cannot rewrite Cargo.lock, so refresh
  # the workspace entries on the release PR branch and push them back.
  sync-lockfile:
    name: Sync Cargo.lock on release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Refresh workspace crate versions in Cargo.lock
        run: cargo update --workspace

      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(release): Sync Cargo.lock"
          git push

  # Attach a macOS CLI build to the GitHub Release.
  assets:
    name: Attach macOS CLI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        working-directory: apps/selara-desktop
        run: npm ci --no-audit --no-fund

      - name: Build, sign, and publish the complete native CLI
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/package-cli.mjs "$TAG" .

  # Share the same packaging workflow with manual recovery of an existing tag.
  desktop:
    name: Publish macOS desktop
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
