name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base branch, so stacked PRs that target
  # a parent branch still get checked. ready_for_review re-runs after the
  # desktop-package draft gate below; converted_to_draft starts a run that
  # cancels the in-flight one via the concurrency group and then skips
  # desktop-package.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  # One group per PR so a new push cancels the stale run. Pushes to main get
  # a unique group per commit and are never cancelled or queued behind each
  # other.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path filter for the two macOS jobs below. Linux jobs always run: they are
  # cheap and are the required checks, and a job skipped by `if:` still
  # reports (as skipped) whereas a path-filtered workflow never does.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR file list via API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'apps/selara/**'
            desktop:
              - '.github/workflows/ci.yml'
              - 'apps/selara-desktop/**'
              - 'scripts/release/**'
              - 'scripts/codex-runtime/**'
              - 'vendor/codex-runtime/**'
              # scripts/release/desktop-release.test.mjs reads the checked-in
              # Homebrew templates; only desktop-package runs those tests.
              - 'homebrew/**'

  check:
    name: fmt / clippy / test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Linux covers the portable crates and the CLI. apps/selara-desktop
      # (Tauri) needs system webkit libraries and is excluded here; the
      # macOS-only shell paths are compiled by the `macos` job below.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Warnings are errors: the tree is lint-clean and the objc cfg noise on
      # macOS FFI paths is declared via check-cfg in selara-platform.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude selara-desktop -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude selara-desktop

  macos:
    name: build / clippy (macOS shell)
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    # Pushes to main always run everything; PRs run this only on Rust changes.
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compiles apps/selara/src/serve.rs and crates/selara-platform/src/macos,
      # which are cfg(target_os = "macos") and never built on Linux. This does
      # not exercise Accessibility, hotkeys, or the picker at runtime; those
      # still need a local macOS check when they change.
      - name: cargo build (selara CLI + serve)
        run: cargo build -p selara

      - name: cargo clippy (macOS crates)
        run: cargo clippy -p selara -p selara-platform --all-targets

      - name: cargo test (platform crate)
        run: cargo test -p selara-platform

      - name: Test working orb geometry
        run: sh apps/selara/native/test.sh --geometry-only

  desktop-package:
    name: package desktop (macOS)
    runs-on: macos-latest
    # 30 min today with a cold Codex runtime cache; ~10 min warm.
    timeout-minutes: 60
    needs: changes
    # Pushes to main always run everything. PRs run this only when Rust or
    # desktop/packaging inputs changed, and never while the PR is a draft.
    if: >-
      (github.event_name == 'push' ||
       needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.desktop == 'true') &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        mode: [local, ci]
    env:
      SELARA_BUILD_MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # scripts/codex-runtime/build.py compiles the pinned Codex runtime into
      # target/codex-runtime (its own CARGO_TARGET_DIR, CARGO_INCREMENTAL=0).
      # rust-cache's post-job cleanup prunes everything under target/ that is
      # not a workspace-lockfile dependency, so this 14-minute compile was
      # never cached even on a full key hit. Restore here, after rust-cache
      # has unpacked target/, so its stale pruned remnants cannot overwrite
      # the restored tree. The save is an explicit step at the end of the job
      # (below), which runs before any post-job cleanup.
      - name: Restore Codex runtime build
        id: codex-cache
        uses: actions/cache/restore@v6
        with:
          path: target/codex-runtime
          key: codex-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('vendor/codex-runtime/**', 'scripts/codex-runtime/build.py', 'scripts/codex-runtime/build.sh') }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/selara-desktop/package-lock.json

      - name: Test release helpers
        run: node --test scripts/release/*.test.mjs

      - name: Test native source cache recovery
        run: python3 scripts/codex-runtime/test-build.py -v

      - name: Install frontend dependencies
        working-directory: apps/selara-desktop
        run: npm ci --no-audit --no-fund

      - name: Generate temporary updater test keys
        if: matrix.mode == 'ci'
        run: node scripts/release/ci-signing.mjs .

      # Reproduce GitHub's empty optional-secret environment. A cargo build
      # alone never reaches certificate import, DMG creation, or updater signing.
      - name: Build app and DMG without Apple credentials
        env:
          APPLE_CERTIFICATE: ''
          APPLE_CERTIFICATE_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ''
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''
        run: node scripts/release/build-desktop.mjs apps/selara-desktop

      - name: Verify app signature, bundled CLI, and DMG
        run: bash scripts/release/verify-desktop.sh .

      - name: Test the actual writing runtime and authentication lock
        if: matrix.mode == 'ci'
        run: |
          cargo test -p selara-core native_runtime_handshake -- --ignored
          scripts/codex-runtime/test-contract.sh
          scripts/codex-runtime/test-runtime.sh
          scripts/codex-runtime/test-auth-lock.sh

      - name: Test desktop and picker coordination
        run: cargo test -p selara-desktop -p selara

      # Cache keys are immutable: the first save for a key wins and later
      # saves are rejected. Only the ci leg builds the dev and test profiles
      # of the runtime (in the runtime-test step above), so it is the sole
      # producer; the faster local leg would otherwise win the race with a
      # release-only tree and the ~10 min of dev/test rebuilds would never be
      # cached.
      - name: Save Codex runtime build
        if: matrix.mode == 'ci' && steps.codex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/codex-runtime
          key: ${{ steps.codex-cache.outputs.cache-primary-key }}

  desktop-dist:
    name: desktop dist is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/selara-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/selara-desktop
        run: npm ci --no-audit --no-fund

      - name: Frontend regression tests
        working-directory: apps/selara-desktop
        run: npm test

      # apps/selara-desktop/dist/index.html is a committed build artifact.
      # Rebuild it and fail if the committed copy is stale, so a change to
      # index.html cannot ship without `npm run build`.
      - name: Rebuild dist
        working-directory: apps/selara-desktop
        run: npm run build

      - name: Verify committed dist matches the build
        run: |
          if ! git diff --exit-code -- apps/selara-desktop/dist/index.html; then
            echo "::error::apps/selara-desktop/dist/index.html is stale. Run 'cd apps/selara-desktop && npm run build' and commit the result."
            exit 1
          fi

  skill-tests:
    name: e2e-qa-orchestrator skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The skill under .cursor/skills ships Python helpers with unit tests.
      # They were committed without ever running in CI.
      - name: Run unit tests
        working-directory: .cursor/skills/e2e-qa-orchestrator
        run: python3 -m unittest discover -s tests -v
