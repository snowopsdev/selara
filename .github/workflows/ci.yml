name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tauri / WebView system libraries for apps/selara-desktop on Linux.
      # macOS-only paths (Accessibility, global hotkey, egui serve) are
      # cfg-gated and are not fully exercised here — test those locally on macOS.
      - name: Install Linux desktop deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Without -D warnings: current tree has known clippy / objc cfg noise,
      # especially around macOS FFI. Tighten later once cleaned up.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace
