name: Desktop release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Attach macOS app (DMG) and Homebrew files
    runs-on: macos-latest
    env:
      SELARA_BUILD_MODE: recovery
      TAG: ${{ inputs.tag }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Require a workflow from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main

      # Keep packaging tools separate from the selected tag, which may still
      # contain the bug this workflow is recovering from.
      - name: Checkout packaging tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/release/desktop-release.mjs resolve "$TAG"

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Validate versions and published CLI; reuse an existing DMG
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          node tooling/scripts/release/desktop-release.mjs prepare "$TAG" source artifacts

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust stable
        if: steps.prepare.outputs.build_required == 'true'
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        if: steps.prepare.outputs.build_required == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target

      - name: Install frontend dependencies
        working-directory: source/apps/selara-desktop
        run: npm ci --no-audit --no-fund

      - name: Build app and DMG
        if: steps.prepare.outputs.build_required == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node tooling/scripts/release/build-desktop.mjs source/apps/selara-desktop
          bash tooling/scripts/release/verify-desktop.sh source

      - name: Verify DMG and prepare signed updater assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node tooling/scripts/release/desktop-release.mjs stage "$TAG" source artifacts

      - name: Upload missing release assets and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tooling/scripts/release/desktop-release.mjs publish "$TAG" source artifacts
          node tooling/scripts/release/desktop-release.mjs verify "$TAG" source artifacts

      - name: Checkout Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: snowopsdev/homebrew-selara
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Prevent outdated recovery from downgrading the tap
        if: env.HAS_TAP_TOKEN == 'true'
        id: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/release/desktop-release.mjs check-tap "$TAG" tap

      - name: Publish Homebrew files
        if: steps.tap.outputs.publish == 'true'
        working-directory: tap
        run: |
          mkdir -p Casks Formula
          cp ../artifacts/homebrew/Casks/selara.rb Casks/selara.rb
          cp ../artifacts/homebrew/Formula/selara.rb Formula/selara.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/selara.rb Formula/selara.rb
          git diff --cached --quiet || git commit -m "selara ${TAG#v}"
          # Never force: a concurrent newer tap commit must reject this push.
          git push

      - name: Summarize release verification
        run: |
          echo "### Verified desktop release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "CLI, DMG, checksums, Homebrew files, and configured updater assets downloaded and verified." >> "$GITHUB_STEP_SUMMARY"
