[package]
name = "selara-desktop"
version.workspace = true
description = "Selara macOS tray + Settings (Tauri)"
authors = ["Aj Nieves"]
edition = "2021"
license = "MIT"

[lib]
name = "selara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { workspace = true }
flate2 = "1"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
selara-core = { path = "../../../crates/selara-core" }
anyhow = { workspace = true }
window-vibrancy = "0.8.0"
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Already in the tree through tauri; encodes app icons as data URLs and
# decodes the share image the webview renders.
base64 = "0.22"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
selara-platform = { path = "../../../crates/selara-platform" }
# Already in the tree through tao/wry: the system accent color, app icons and
# running apps for the per-app lists, and the share image on the pasteboard.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSBitmapImageRep",
  "NSColor",
  "NSColorSpace",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPasteboard",
  "NSRunningApplication",
  "NSWorkspace",
  "libc",
  "objc2-core-foundation",
] }
