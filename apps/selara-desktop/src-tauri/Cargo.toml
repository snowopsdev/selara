[package]
name = "selara-desktop"
version = "0.1.0"
description = "Selara macOS tray + Settings (Tauri)"
authors = ["Aj Nieves"]
edition = "2021"
license = "MIT"

[lib]
name = "selara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
selara-core = { path = "../../../crates/selara-core" }
anyhow = { workspace = true }
