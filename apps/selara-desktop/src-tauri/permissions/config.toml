[[permission]]
identifier = "allow-get-config"
description = "Load Selara config"
commands.allow = ["get_config"]

[[permission]]
identifier = "allow-save-config"
description = "Save Selara config"
commands.allow = ["save_config"]

[[permission]]
identifier = "allow-save-config-section"
description = "Save one section of the Selara config, leaving the rest as on disk"
commands.allow = ["save_config_section"]

[[permission]]
identifier = "allow-api-key-source"
description = "Report where the provider API key comes from (never the key itself)"
commands.allow = ["api_key_source"]

[[permission]]
identifier = "allow-store-api-key"
description = "Store the provider API key in the OS keychain"
commands.allow = ["store_api_key"]

[[permission]]
identifier = "allow-clear-api-key"
description = "Remove the provider API key from the OS keychain"
commands.allow = ["clear_api_key"]

[[permission]]
identifier = "allow-export-commands"
description = "Write the command list to a file chosen in a save dialog"
commands.allow = ["export_commands"]

[[permission]]
identifier = "allow-import-commands"
description = "Merge commands from a file chosen in an open dialog"
commands.allow = ["import_commands"]

[[permission]]
identifier = "allow-config-path"
description = "Read config file path"
commands.allow = ["config_path"]

[[permission]]
identifier = "allow-history-list"
description = "Read the transformation history `selara serve` keeps next to the config"
commands.allow = ["history_list"]

[[permission]]
identifier = "allow-history-clear"
description = "Delete the transformation history file"
commands.allow = ["history_clear"]

[[permission]]
identifier = "allow-history-path"
description = "Read the history file path"
commands.allow = ["history_path"]

[[permission]]
identifier = "allow-chatgpt-auth-status"
description = "Read ChatGPT / Codex CLI login status (Experimental)"
commands.allow = ["chatgpt_auth_status"]

[[permission]]
identifier = "allow-chatgpt-login"
description = "Start ChatGPT / Codex CLI login (Experimental)"
commands.allow = ["chatgpt_login"]

[[permission]]
identifier = "allow-chatgpt-login-cancel"
description = "Cancel the pending browser sign-in"
commands.allow = ["chatgpt_login_cancel"]

[[permission]]
identifier = "allow-chatgpt-logout"
description = "Log out of ChatGPT / Codex CLI (Experimental)"
commands.allow = ["chatgpt_logout"]

[[permission]]
identifier = "allow-list-chatgpt-models"
description = "List ChatGPT Codex model slugs (Experimental)"
commands.allow = ["list_chatgpt_models_cmd"]

[[permission]]
identifier = "allow-list-provider-models"
description = "List models from the configured BYOK provider"
commands.allow = ["list_provider_models_cmd"]

[[permission]]
identifier = "allow-serve-status"
description = "Report whether `selara serve` is running (reads its pidfile)"
commands.allow = ["serve_status"]

[[permission]]
identifier = "allow-accessibility-status"
description = "Report Accessibility trust from the managed selection process"
commands.allow = ["accessibility_status"]

[[permission]]
identifier = "allow-open-accessibility-settings"
description = "Open System Settings on the Accessibility privacy pane"
commands.allow = ["open_accessibility_settings"]

[[permission]]
identifier = "allow-serve-start"
description = "Start the bundled `selara serve` sidecar under the app's supervisor"
commands.allow = ["serve_start"]

[[permission]]
identifier = "allow-serve-stop"
description = "Stop the `selara serve` sidecar the app started"
commands.allow = ["serve_stop"]

[[permission]]
identifier = "allow-serve-restart"
description = "Restart the `selara serve` sidecar the app started"
commands.allow = ["serve_restart"]

[[permission]]
identifier = "allow-serve-log"
description = "Read the last lines `selara serve` printed while supervised by the app"
commands.allow = ["serve_log"]

[[permission]]
identifier = "allow-serve-supervisor-status"
description = "Report whether the app manages `selara serve`, or an external one runs"
commands.allow = ["serve_supervisor_status"]

[[permission]]
identifier = "allow-app-version"
description = "Read the running app's version"
commands.allow = ["app_version"]

[[permission]]
identifier = "allow-check-for-updates"
description = "Check the release feed for a newer Selara build (no download)"
commands.allow = ["check_for_updates"]

[[permission]]
identifier = "allow-update-status"
description = "Read the current update progress without starting another check"
commands.allow = ["update_status"]

[[permission]]
identifier = "allow-install-update"
description = "Download, install, and restart into the update found by the last check"
commands.allow = ["install_update"]

[[permission]]
identifier = "allow-usage-summary"
description = "Read the local usage ledger (tokens and estimated cost)"
commands.allow = ["usage_summary"]

[[permission]]
identifier = "allow-clear-usage"
description = "Truncate the local usage ledger"
commands.allow = ["clear_usage"]
