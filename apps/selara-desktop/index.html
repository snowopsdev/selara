    $("#cmd-hotkey").onclick = startShortcutRecording;
    $("#cmd-hotkey").onblur = () => stopShortcutRecording();
    $("#cmd-hotkey-clear").onclick = () => {
      stopShortcutRecording();
      $("#cmd-hotkey").value = "";
      renderShortcutRecorder("Shortcut cleared. Save changes to apply.");
      $("#cmd-hotkey").focus();
    };
    const del = $("#cmd-delete");
    if (del) del.onclick = async () => {
      if (await deleteCommand(id)) closeCommandSheet();
      else if (del.isConnected && !del.disabled) del.focus();
    };

    $("#cmd-save").onclick = async () => {
      if (!ensureConfigReady() || commandOperationPending) return;
      stopShortcutRecording();
      const label = $("#cmd-label").value.trim();
      const prompt = $("#cmd-prompt").value.trim();
      const kind = "replace";
      const hotkeyRaw = $("#cmd-hotkey").value.trim();
      const hotkey = hotkeyRaw ? hotkeyRaw : null;
      const shortcutError = shortcutConflict(hotkey);
      if (shortcutError) { renderShortcutRecorder(shortcutError); $("#cmd-hotkey").focus(); return; }
      const modelRaw = $("#cmd-model").value.trim();
      const cmdModel = modelRaw ? modelRaw : null;
      const apps = parseAppList($("#cmd-apps").value);
      if (!label || !prompt) {
        setCommandError("Label and prompt are required.");
        setStatus("Label and prompt are required");
        (!label ? $("#cmd-label") : $("#cmd-prompt")).focus();
        return;
      }
      const fields = { label, prompt, kind, hotkey, model: cmdModel, apps };
      const nextCommands = editingId
        ? config.commands.map((c) => c.id === editingId ? Object.assign({}, c, fields) : c)
        : [...config.commands, { id: slug(label) + "-" + Math.random().toString(36).slice(2, 7), ...fields }];
      if (await saveCommands(nextCommands)) {
        renderCommands();
        closeCommandSheet();
      } else {
        const save = $("#cmd-save");
        save.dataset.readyLabel = "Retry save";
        save.textContent = "Retry save";
        save.focus();
      }
    };
  }

  function renderLimits() {
    const L = config.limits || {};
    const s = $("#section-limits");
    const editAttr = configEditAttr();
    s.innerHTML =
      "<h1 data-tauri-drag-region>Limits</h1>" +
      "<p class=\"lead\">Gentle rails for large selections. Set any value to 0 for unlimited.</p>" +
      configGateMarkup("limits-config-gate") +
      "<div class=\"section-label\">Thresholds</div>" +
      "<div class=\"panel\">" +
      "<div class=\"form-row\">" +
      "<label for=\"soft_warn\">Soft warn (chars)</label>" +
      "<div class=\"control-stack\">" +
      "<input id=\"soft_warn\"" + editAttr + " type=\"number\" min=\"0\" value=\"" + (L.soft_warn_chars ?? 8000) + "\" />" +
      "<p class=\"field-hint\">Warn before sending large selections.</p>" +
      "</div></div>" +
      "<div class=\"form-row\">" +
      "<label for=\"hard_max\">Hard max (chars)</label>" +
      "<div class=\"control-stack\">" +
      "<input id=\"hard_max\"" + editAttr + " type=\"number\" min=\"0\" value=\"" + (L.hard_max_chars ?? 100000) + "\" />" +
      "<p class=\"field-hint\">Block anything past this size.</p>" +
      "</div></div>" +
      "<div class=\"form-row\">" +
      "<label for=\"replace_warn\">Replace caution (chars)</label>" +
      "<div class=\"control-stack\">" +
      "<input id=\"replace_warn\"" + editAttr + " type=\"number\" min=\"0\" value=\"" + (L.replace_warn_chars ?? 4000) + "\" />" +
      "<p class=\"field-hint\">Ask again before replacing a selection larger than this.</p>" +
      "</div></div>" +
      "</div>" +
      "<div class=\"section-label\">Secrets</div>" +
      "<div class=\"panel\">" +
      "<div class=\"form-row\">" +
      "<label class=\"check-row\" for=\"secret_guard\"><input type=\"checkbox\" id=\"secret_guard\"" + editAttr + (L.secret_guard === false ? "" : " checked") + " /> Warn before sending secret-shaped text to a hosted provider</label>" +
      "<p class=\"field-hint\">Looks for API keys, private key blocks, JWTs, and card numbers. Local servers (localhost, .local, private IPs) are exempt.</p>" +
      "</div>" +
      "</div>" +
      "<div class=\"limits-actions\">" +
      "<button class=\"btn secondary\" id=\"reset-limits\"" + editAttr + ">Reset to Defaults</button>" +
      "</div>";
    const saveLimits = async (ev) => {
      if (!ensureConfigReady()) return;
      const field = ev && ev.currentTarget;
      const invalid = ["#soft_warn", "#hard_max", "#replace_warn"].map((sel) => $(sel)).find((el) => {
        const n = Number(el.value);
        return el.validity.badInput || el.value.trim() === "" || !Number.isFinite(n) || n < 0;
      });
      if (invalid) {
        showFieldError(invalid, "Enter 0 or a positive number of characters. 0 means no limit.");
        return;
      }
      const saved = await saveSection("limits", {
        soft_warn_chars: num($("#soft_warn").value),
        hard_max_chars: num($("#hard_max").value),
        replace_warn_chars: num($("#replace_warn").value),
        secret_guard: $("#secret_guard").checked,
      }, (e) => showFieldError(field, String(e)));
      if (saved) clearFieldErrors("#section-limits");
    };
    ["#soft_warn", "#hard_max", "#replace_warn", "#secret_guard"].forEach((sel) => $(sel).addEventListener("change", saveLimits));
    $("#reset-limits").onclick = async () => {
      if (!ensureConfigReady()) return;
      await saveSection("limits", { soft_warn_chars: 8000, hard_max_chars: 100000, replace_warn_chars: 4000, secret_guard: true });
      renderLimits();
    };
  }

  // Save one tab. The backend re-reads config.toml, replaces just this
  // section, writes atomically, and returns the merged config, so a change
  // made elsewhere (for example Limits inside `selara serve`) is kept and
  // shows up here after the save.
  // Saves run one at a time, in the order they were requested. With
  // save-as-you-go, two quick edits send two full-section snapshots; the
  // native lock serializes the writes but not their arrival order, so an
  // older snapshot could otherwise land last and undo the newer edit.
  // A save starts at once when none is running, and otherwise waits its turn.
  let saveInFlight = null;
  async function saveSection(section, value, onError) {
    if (!ensureConfigReady()) return false;
    const run = async () => {
      try {
        const merged = await invoke("save_config_section", { section, value });
        if (merged && typeof merged === "object") config = normalizeConfigForUi(merged);
        setStatus("Saved");
        return true;
      } catch (e) {
        setStatus(String(e), "error");
        if (onError) onError(e);
        return false;
      }
    };
    const save = saveInFlight ? saveInFlight.then(run) : run();
    saveInFlight = save;
    save.finally(() => { if (saveInFlight === save) saveInFlight = null; });
    return save;
  }

  // The background check (10 s after launch, then daily) and the tray's
  // "Check for updates…" item report through this event; keep the footer in step.
  let updateListenerBound = false;
  function listenForUpdates() {
    if (updateListenerBound) return;
    const g = window.__TAURI__;
    if (!g || !g.event || typeof g.event.listen !== "function") return;
    updateListenerBound = true;
    g.event.listen("update-changed", (ev) => {
      updateStatus = ev && ev.payload ? ev.payload : null;
      renderUpdates();
    }).catch(() => { updateListenerBound = false; });
    }

  // History tab: what `serve` wrote to history.jsonl, newest first. Read-only
  // apart from the copy buttons and Clear. Legacy entries keep a neutral label
  // so old popup/insert records remain understandable without exposing removed
  // controls in the current UI.
  let historyEntries = [];
  let historyError = "";

  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) { /* fall through to the execCommand path */ }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  let historyClearPending = false;
  async function refreshHistoryData() {
    try {
      const list = await invoke("history_list");
      historyEntries = Array.isArray(list) ? list : [];
      historyError = "";
    } catch (e) {
      historyEntries = [];
      historyError = String(e);
    }
  }

  function historyKindLabel(entry) {
    if (entry.outcome === "not_applied") return "Not applied";
    if (entry.outcome === "paste_unverified") return "Paste unverified";
    const legacy = !entry.original || (entry.kind && String(entry.kind).toLowerCase() !== "replace");
    return legacy ? "Legacy result" : "Replace";
  }

  function renderHistory() {
    const s = $("#section-history");
    const now = Math.floor(Date.now() / 1000);
    const rows = historyEntries.map((h, i) => {
      const when = relativeTime(h.ts, now);
      const app = h.app ? " · " + escapeHtml(h.app) : "";
      return (
        "<div class=\"hist-item\" data-index=\"" + i + "\">" +
        "<div class=\"hist-main\">" +
        "<h3><span class=\"hist-name\">" + escapeHtml(h.label || h.command_id || "Command") + "</span>" +
        "<span class=\"badge" + (h.outcome === "not_applied" || h.outcome === "paste_unverified" ? " warn" : "") + "\">" + escapeHtml(historyKindLabel(h)) + "</span></h3>" +
        "<div class=\"hist-meta\" title=\"" + escapeAttr(h.ts ? new Date(h.ts * 1000).toLocaleString() : "") + "\">" + escapeHtml(when) + app + "</div>" +
        (h.outcome === "paste_unverified" ? '<p class="field-hint">Check your document before copying this result; the paste may have completed.</p>' :
          h.outcome === "not_applied" ? '<p class="field-hint">Your selection was not changed. The completed rewrite is saved here.</p>' : "") +
        "<dl class=\"hist-preview\">" +
        "<dt>Original</dt><dd class=\"original\" title=\"" + escapeAttr(previewLine(h.original, 400)) + "\">" + escapeHtml(previewLine(h.original, 160)) + "</dd>" +
        "<dt>Result</dt><dd class=\"result\" title=\"" + escapeAttr(previewLine(h.result, 400)) + "\">" + escapeHtml(previewLine(h.result, 160)) + "</dd>" +
        "</dl></div>" +
        "<div class=\"row-actions\">" +
        "<button type=\"button\" class=\"btn secondary\" data-act=\"copy-result\" title=\"Copy the result to the clipboard\">Copy</button>" +
        "<button type=\"button\" class=\"btn secondary\" data-act=\"copy-menu\" aria-haspopup=\"menu\" aria-label=\"More copy options\" title=\"Copy the result or the original\">" + PULLDOWN_SVG + "</button>" +
        "</div></div>"
      );
    }).join("");

    let listInner = rows;
    if (historyError) {
      listInner = "<div class=\"empty\"><strong>Could not read history</strong><span>" + escapeHtml(historyError) + "</span></div>";
    } else if (!historyEntries.length) {
      listInner =
        "<div class=\"empty\"><strong>No history yet</strong>" +
        "<span>Every command that finishes while <code>selara serve</code> runs shows up here, newest first (last 50).</span></div>";
    }

    s.innerHTML =
      "<h1 data-tauri-drag-region>History</h1>" +
      "<p class=\"lead\">Your completed rewrites, including results that could not be applied. Copy a result or the original text back to the clipboard; " +
      "to restore a replacement in the source app, use that app's native undo command. " +
      "The file holds the selected text verbatim and is readable only by you.</p>" +
      "<div class=\"toolbar\">" +
      "<span class=\"field-hint\" id=\"history-count\" style=\"flex:1\">" + historyEntries.length + (historyEntries.length === 1 ? " entry" : " entries") + "</span>" +
      "<button type=\"button\" class=\"btn secondary\" id=\"history-refresh\">Refresh</button>" +
      "<button type=\"button\" class=\"btn danger\" id=\"history-clear\"" + (historyEntries.length ? "" : " disabled") + ">Clear history</button>" +
      "</div>" +
      "<div class=\"cmd-list\" id=\"history-list\">" + listInner + "</div>";

    $("#history-refresh").onclick = async () => {
      setStatus("Refreshing history…");
      await refreshHistoryData();
      renderHistory();
      setStatus("History refreshed");
    };
    $("#history-clear").onclick = async () => {
      if (historyClearPending) return;
      historyClearPending = true;
      try {
        if (!(await confirmAction("Clear the history?", "This deletes every saved original and result.", "Clear History"))) return;
        await invoke("history_clear");
        await refreshHistoryData();
        renderHistory();
        setStatus("History cleared");
      } catch (e) {
        setStatus(String(e), "error");
      } finally {
        historyClearPending = false;
      }
    };
    const copyFromHistory = async (h, which) => {
      const ok = await copyText((which === "original" ? h.original : h.result) || "");
      setStatus(ok ? (which === "original" ? "Copied original" : "Copied result") : "Copy failed", ok ? "info" : "error");
    };
    const historyMenu = (h, anchor) => showNativeMenu([
      { text: "Copy Result", action: () => copyFromHistory(h, "result") },
      { text: "Copy Original", enabled: !!h.original, action: () => copyFromHistory(h, "original") },
    ], anchor);
    $("#history-list").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const row = btn.closest(".hist-item");
      const h = historyEntries[Number(row && row.dataset.index)];
      if (!h) return;
      if (btn.dataset.act === "copy-menu") historyMenu(h, btn);
      else await copyFromHistory(h, "result");
    });
    $("#history-list").addEventListener("contextmenu", (ev) => {
      const row = ev.target.closest(".hist-item");
      const h = row && historyEntries[Number(row.dataset.index)];
      if (!h) return;
      ev.preventDefault();
      historyMenu(h);
    });
  }

  // Destructive actions ask with a native alert whose button names the action.
  // Builds without the command (and the DOM tests) fall back to confirm().
  async function confirmAction(title, message, confirmLabel) {
    try {
      const answer = await invoke("confirm_action", { title, message, confirmLabel });
      if (typeof answer === "boolean") return answer;
    } catch (_) { /* fall back below */ }
    return window.confirm(message);
  }

  // Native macOS context/pull-down menu. `items` are { text, action, enabled }
  // or "-" for a separator. Returns false when the menu API is unavailable.
  // Tauri routes menu actions by item id, so every popup gets fresh ids and
  // the previous menu is closed before a new one opens. Otherwise a stale
  // handler with the same id could run for another row's menu.
  let nativeMenuSeq = 0;
  let openNativeMenu = null;
  async function showNativeMenu(items, anchor) {
    const api = window.__TAURI__ && window.__TAURI__.menu;
    if (!api || !api.Menu) return false;
    try {
      if (openNativeMenu && typeof openNativeMenu.close === "function") {
        const previous = openNativeMenu;
        openNativeMenu = null;
        await previous.close().catch(() => {});
      }
      const menuId = ++nativeMenuSeq;
      const menu = await api.Menu.new({
        items: items.map((item, i) => item === "-"
          ? { item: "Separator" }
          : { id: "selara-menu-" + menuId + "-" + i, text: item.text, enabled: item.enabled !== false, action: () => item.action() }),
      });
      openNativeMenu = menu;
      let at;
      const dpi = window.__TAURI__.dpi;
      if (anchor && dpi && dpi.LogicalPosition) {
        const r = anchor.getBoundingClientRect();
        at = new dpi.LogicalPosition(r.left, r.bottom + 4);
      }
      await menu.popup(at);
      return true;
    } catch (e) {
      console.warn("context menu unavailable:", e);
      return false;
    }
  }

  function clearFieldErrors(sectionSelector) {
    document.querySelectorAll(sectionSelector + " .field-error").forEach((note) => note.remove());
  }

  // Inline error beside the control that failed to save; cleared on success.
  function showFieldError(el, message) {
    const stack = el && (el.closest(".control-stack") || el.closest(".form-row"));
    if (!stack) return;
    let note = stack.querySelector(".field-error");
    if (!message) { if (note) note.remove(); return; }
    if (!note) {
      note = document.createElement("p");
      note.className = "field-hint error field-error";
      note.setAttribute("role", "alert");
      stack.appendChild(note);
    }
    note.textContent = message;
  }

  // WebKit's CSS AccentColor is always the default blue in a WKWebView, while
  // native checkboxes draw in the user's accent. Ask the app for the real
  // color; re-read it when the window regains focus (the user may have just
  // changed it in System Settings) and when the appearance flips.
  // Keep white labels on accent fills unless they drop below the 3:1 WCAG
  // contrast for large text and UI (Yellow, Orange, and Green accents).
  function accentLabelColor(hex) {
    const channel = (i) => {
      const c = parseInt(hex.slice(i, i + 2), 16) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    const luminance = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
    return 1.05 / (luminance + 0.05) < 3 ? "#1d1d1f" : "#ffffff";
  }

  async function applySystemAccent() {
    let hex = null;
    try { hex = await invoke("system_accent_color"); } catch (_) { hex = null; }
    const root = document.documentElement.style;
    if (typeof hex === "string" && /^#[0-9a-f]{6}$/i.test(hex)) {
      root.setProperty("--accent", hex);
      root.setProperty("--on-accent", accentLabelColor(hex));
    } else {
      root.removeProperty("--accent");
      root.removeProperty("--on-accent");
    }
  }
  window.addEventListener("focus", applySystemAccent);
  if (window.matchMedia) {
    const scheme = window.matchMedia("(prefers-color-scheme: dark)");
    if (scheme.addEventListener) scheme.addEventListener("change", applySystemAccent);
  }

  async function load() {
    setStatus("Loading config…");
    applySystemAccent();
    // Before the first await: the startup check fires 10 s after launch and a
    // slow load must not miss it.
    listenForUpdates();
    // Keep the whole Settings surface available while native calls are in
    // flight. In particular, a user can start editing provider fields before
    // a slow account-status response returns.
    renderSettings();
    renderStatus();
    renderUsage();
    let configLoaded = false;
    try {
      const loaded = await invoke("get_config");
      if (!loaded || typeof loaded !== "object") throw new Error("Saved settings were unavailable");
      config = normalizeConfigForUi(loaded);
      config.provider = config.provider || defaultConfig().provider;
      if (providerDraft) config.provider = { ...config.provider, ...providerDraft };
      if (generalDraft) config = { ...config, ...generalDraft };
      configLoadState = "ready";
      configLoadError = "";
      configLoaded = true;
      renderSettings();
      for (const kind of Object.keys(PROVIDERS).filter(isCliProvider)) {
        const saved = config.provider.kind === kind ? config.provider : (config.provider_connections || {})[kind + ":api_key"];
        refreshCliRuntime(kind, saved && saved.cli_binary || "");
      }
      await refreshChatgptStatus();
      await refreshStatusData();
      renderStatus();
      renderModels();
      await refreshHistoryData();
      renderHistory();
      await listenForServeChanges();
      setStatus("Loaded");
    } catch (e) {
      const msg = String(e);
      if (!configLoaded) {
        configLoadState = "failed";
        configLoadError = msg;
        renderSettings();
      }
      setStatus(msg, "error");
      if (!configLoaded) {
        $("#section-status").innerHTML =
          "<h1 data-tauri-drag-region>Settings unavailable</h1><p class=\"lead error\">" + escapeHtml(msg) + "</p>" +
          "<p class=\"hint\">Editing is disabled because saved settings could not be loaded. Restart Selara to try again.</p>";
      }
    }
  }

  // Wait briefly for Tauri global bridge
  let tries = 0;
  (function waitApi() {
    if (getInvoke() || tries > 50) {
      load();
      return;
    }
    tries += 1;
    setStatus("Waiting for Tauri… (" + tries + ")");
    setTimeout(waitApi, 100);
  })();
})();
  </script>
</body>
</html>
