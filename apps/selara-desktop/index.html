  function setStatusPip(id) {
    openStatusPip = id || "";
    document.querySelectorAll("#section-status .status-pip").forEach((pip) => {
      const open = pip.id === "status-" + openStatusPip;
      pip.querySelector(".pip-face").setAttribute("aria-expanded", String(open));
      pip.querySelector(".pip-pop").hidden = !open;
    });
  }
  function closeStatusPopovers() { if (openStatusPip) setStatusPip(""); }
  document.addEventListener("click", (event) => {
    if (openStatusPip && !event.target.closest("#section-status .status-pip")) setStatusPip("");
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || !openStatusPip) return;
    const face = document.querySelector("#status-" + openStatusPip + " .pip-face");
    setStatusPip("");
    if (face) face.focus();
    event.preventDefault();
  });

  function renderStatus() {
    renderUpdates();
    // Any pending provider check belongs to the previous view. Its response
    // must not write into detached status details after a refresh.
    providerStatusRequestId += 1;
    const s = $("#section-status");
    const r = statusReadiness();
    const { p, kind, meta, auth, sv, sup, running, trust, axUnverified } = r;

    // 1. serve (managed by this app, running elsewhere, or stopped)
    const pid = sup.pid || sv.pid;
    const serveDot = sv.error ? "unknown" : (running ? "ok" : "bad");
    const serveState = sv.error
      ? "Unknown"
      : (sup.managed ? "Managed by the Settings app (pid " + pid + ")"
        : (running ? "Running outside the app (pid " + pid + ")" : "Not running"));
    const serveValue = sv.error ? "Unknown" : (running ? (sup.managed ? "Running" : "Running outside") : "Stopped");
    const serveActions = running
      ? "<div class=\"actions\">" + (sup.managed
        ? "<button type=\"button\" class=\"btn secondary\" id=\"serve-stop\">Stop</button>" +
          "<button type=\"button\" class=\"btn secondary\" id=\"serve-restart\">Restart</button>"
        : "<p class=\"field-hint\">Started outside the app; stop it with Ctrl+C in its terminal. The app will not start a second copy.</p>") + "</div>"
      : "";
    const logLines = (serveLogLines || []).slice(-40);
    const serveLog = logLines.length
      ? "<details class=\"serve-log\"><summary>Recent output (" + logLines.length + " lines)</summary><pre>" + escapeHtml(logLines.join("\n")) + "</pre></details>"
      : "";
    const serveBody =
      "<p class=\"field-hint\">" + (running ? "The global hotkey is live." : "Hotkeys only work while it runs.") + "</p>" +
      serveActions +
      "<details class=\"serve-log\"><summary>Troubleshooting</summary>" +
      "<dl class=\"status-meta\"><dt>Pidfile</dt><dd>" + escapeHtml(sv.pidfile || "unknown") + "</dd></dl>" +
      "<p class=\"field-hint\">To run it outside Settings, use <code>selara serve</code> in Terminal, or <code>cargo run -p selara -- serve</code> from a source checkout.</p></details>" +
      (sup.last_error ? "<p class=\"field-hint error\">" + escapeHtml(sup.last_error) + "</p>" : "") +
      (sv.error ? "<p class=\"field-hint error\">" + escapeHtml(sv.error) + "</p>" : "") +
      serveLog;

    // 2. Accessibility. The command reports the trust of the managed child;
    // an externally started service is deliberately unknown because this app
    // cannot inspect another process's protocol status.
    const managed = !!sup.managed;
    const external = !!sup.external || (!managed && !!sv.running);
    const axDot = trust === "granted" ? "ok" : (trust === "missing" ? "bad" : "unknown");
    const axState = trust === "granted" ? "Granted" : (trust === "missing" ? "Missing" : (axUnverified ? "Can’t verify" : "Unknown"));
    const axBody = external
      ? "<p class=\"field-hint\" id=\"status-ax-caveat\">Accessibility trust is unknown because this <code>serve</code> process was started outside Selara; the grant can only be checked for a <code>serve</code> started from this Settings app. Stop that process, then start <code>serve</code> here to inspect and manage its grant.</p>"
      : (managed
        ? "<p class=\"field-hint\">This is the Accessibility grant reported by Selara's managed <code>serve</code> process. Accessibility allows Selara to verify selected text before replacing it.</p>"
        : "<p class=\"field-hint\">Start <code>serve</code> from this Settings app to inspect the managed process's Accessibility grant.</p>");

    // 3. Provider (the key is never rendered)
    const baseUrl = auth === "chatgpt"
      ? "not used with ChatGPT via Codex"
      : ((p.base_url || "").trim() || "default (" + meta.baseUrl + ")");
    const authSt = normalizeAuthStatus(chatgptStatus);
    const tested = providerTested(r);
    const providerAuthState = p.enabled === false ? "Disabled" : isCliProvider(kind) ? cliRuntimeLabel(cliRuntimeFor(kind, String(p.cli_binary || "").trim())) : auth === "chatgpt" ? authStatusLabel(authSt) : (authSt.state === "api_key_only" ? "API key only" : (r.steps.provider ? "API key" : "No API key"));
    const providerDot = p.enabled === false || !r.steps.provider ? "unknown" : (auth === "chatgpt" && !isChatgptConnected(authSt) ? statusDotClass(authSt) : (tested ? "ok" : "unknown"));
    const modelName = (p.model || "").trim() || (isCliProvider(kind) ? "CLI default" : "not set");
    const providerValue = p.enabled === false ? "Disabled" : (!r.steps.provider ? "Not set up" : ((p.model || "").trim() || meta.label));
    const providerBody =
      "<dl class=\"status-meta\">" +
      "<dt>Provider</dt><dd>" + escapeHtml(meta.label) + "</dd>" +
      "<dt>Model</dt><dd>" + escapeHtml(modelName) + "</dd>" +
      (isCliProvider(kind) ? "<dt>CLI</dt><dd>" : "<dt>Base URL</dt><dd>") + escapeHtml(isCliProvider(kind) ? (p.cli_binary || meta.binary + " (auto-detect)") : baseUrl) + "</dd>" +
      "<dt>Auth</dt><dd>" + (isCliProvider(kind) ? "CLI account" : auth === "chatgpt" ? "ChatGPT via Codex" : "API key") + "</dd>" +
      "<dt>Tested</dt><dd>" + (tested ? "A request has gone through this connection." : "Not yet. Check the connection or try a command.") + "</dd>" +
      "</dl>" +
      "<div class=\"actions\">" +
      "<button type=\"button\" class=\"btn secondary\" id=\"status-check-provider\"" + (p.enabled === false ? " disabled" : "") + ">Check connection</button>" +
      "<span class=\"field-hint\" id=\"status-provider-result\">" +
      (p.enabled === false ? "Enable this connection in Providers to use it for writing." : isCliProvider(kind) ? "Checks the installed CLI version. Account access is verified when a command runs." : auth === "chatgpt" ? escapeHtml(authSt.message || "Checks the shared Codex account sign-in.") : "Lists models with the saved key. The key itself is never shown here.") +
      "</span></div>";

    // 4. Shortcuts
    const cmdKeys = (config.commands || []).filter((c) => c.hotkey && String(c.hotkey).trim());
    const shortcutRows =
      "<li><span>Custom instruction</span>" + keyBadge(config.hotkey || "ctrl+shift+space") + "</li>" +
      cmdKeys.map((c) => "<li><span>" + escapeHtml(c.label) + "</span>" + keyBadge(c.hotkey) + "</li>").join("");
    const shortcutCount = 1 + cmdKeys.length;
    const shortcutsBody =
      "<ul class=\"status-list\">" + shortcutRows + "</ul>" +
      "<p class=\"field-hint\">" +
      (cmdKeys.length ? "" : "No command has its own shortcut yet; add one from the Commands tab. ") +
      "Shortcuts work while serve is running and pick up saved changes within about a second.</p>";

    // The shortcuts dot says whether those shortcuts are live right now.
    const pips =
      "<div class=\"status-pips\">" +
      statusPip("serve", "Shell", serveDot, serveValue, "selara serve", serveState, serveBody) +
      statusPip("accessibility", "Accessibility", axDot, axState, "Accessibility", axState, axBody) +
      statusPip("provider", "Provider", providerDot, providerValue, "Provider", providerAuthState, providerBody) +
      statusPip("shortcuts", "Shortcuts", running ? "ok" : "off", shortcutCount + (running ? " active" : " paused"), "Shortcuts", shortcutCount + (shortcutCount === 1 ? " shortcut" : " shortcuts"), shortcutsBody) +
      "</div>";
    const foot =
      "<div class=\"status-foot\"><p class=\"field-hint\">Select a pip for details and controls.</p>" +
      "<button type=\"button\" class=\"btn linkish\" id=\"status-refresh\">Refresh</button></div>";

    let body;
    if (r.ready) {
      body =
        "<div class=\"status-hero\" id=\"status-hero\">" +
        "<div class=\"status-mark" + (tested ? "" : " untested") + "\" id=\"status-hero-mark\" aria-hidden=\"true\"></div>" +
        "<div><h2 id=\"status-hero-title\">Ready" + (tested ? "" : "<span class=\"sub\"> · provider not yet tested</span>") + "</h2>" +

  // After "Open Settings", watch for the grant so step 2 completes on its own.
  function watchAccessibilityGrant() {

      try {
        const next = normalizeAxTrust(await invoke("accessibility_status"));
        if (next !== axTrust) {
          axTrust = next;
          if (statusReadiness().ready) await refreshStatusUsage();
          renderStatus();
        }
        if (next === "granted") return;

      axPollTimer = setTimeout(poll, 1500);
    };
    axPollTimer = setTimeout(poll, 1500);
  }

  // General (8A): a keycap recorder for the custom-instruction hotkey, a

  const CHEVRON_DOWN_SVG = "<svg class=\"lang-chevron\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 4.5l3 3 3-3\"/></svg>";

  function loadRunningApps() {
    if (!runningAppsLoaded) {
      runningAppsLoaded = invoke("running_apps").then((list) => {
        const apps = Array.isArray(list) ? list.filter((a) => a && (a.bundle_id || a.name)) : [];
        for (const a of apps) if (a.bundle_id && a.name) { appNames[a.bundle_id] = a.name; appNames[a.bundle_id.toLowerCase()] = a.name; }

  function appIconMarkup(entry) {

  function excludedChipsHtml() {
    const chips = generalExcluded.map((entry) => {
      const name = excludedAppName(entry, appNames);

      return "<span class=\"app-chip\" data-app=\"" + escapeAttr(entry) + "\"><span class=\"app-icon\" style=\"background:" + (appIconCache.get(entry) ? "transparent" : color) + "\" aria-hidden=\"true\">" + appIconMarkup(entry) + "</span>" +
        "<span class=\"app-name\" title=\"" + escapeAttr(entry) + "\">" + escapeHtml(name) + "</span>" +
        "<button type=\"button\" data-remove=\"" + escapeAttr(entry) + "\" aria-label=\"Remove " + escapeAttr(name) + "\"" + configEditAttr() + ">✕</button></span>";

  function renderExcludedChips() {
    const box = $("#excluded-apps");
    if (!box) return;
    box.innerHTML = excludedChipsHtml();
    for (const entry of generalExcluded) {
      if (appIconCache.has(entry) || entry.includes("*")) continue;
      appIconCache.set(entry, null);
      invoke("app_icon", { app: entry }).then((url) => {
        if (typeof url !== "string" || !/^data:image\//.test(url)) return;
        appIconCache.set(entry, url);

  function commitExcluded(next) {

  function addExcludedApp(entry, name) {
    const value = String(entry || "").trim();

    if (name) { appNames[value] = name; appNames[value.toLowerCase()] = name; }
    if (generalExcluded.some((e) => e.toLowerCase() === value.toLowerCase())) { renderExcludedChips(); return; }
    commitExcluded([...generalExcluded, value]);

  function openExcludedEntry() {
    const add = $("#excluded-add");

    add.replaceWith(wrap);

      else renderExcludedChips();

  async function chooseExcludedApp() {

  async function openExcludedMenu(anchor) {

  function generalHotkeyConflict(chord) {
    const key = canonicalShortcut(chord);
    if (!key) return "";
    const pretty = hotkeyKeycapList(chord).join("");
    if (["cmd+c", "cmd+x", "cmd+v", "cmd+z", "shift+cmd+z", "cmd+q", "cmd+w", "cmd+tab", "escape"].includes(key)) return pretty + " is reserved by macOS. Try another.";
    const other = (config.commands || []).find((c) => canonicalShortcut(c.hotkey) === key);
    return other ? pretty + " is already used by " + (other.label || other.id) + ". Try another." : "";
  }
  function keycapsHtml(chord) {
    const caps = hotkeyKeycapList(chord);
    return caps.length ? caps.map((k) => "<span class=\"kc\">" + escapeHtml(k) + "</span>").join("") : "<span class=\"placeholder\">Click to record</span>";
  }
  function renderHotkeyRecorder(state, message, chord) {
    const button = $("#hotkey");
    const hint = $("#hotkey-hint");
    if (!button) return;
    button.dataset.state = state;
    if (state === "conflict") { button.style.animation = "none"; void button.offsetWidth; button.style.animation = ""; }
    button.innerHTML = state === "recording" ? "<span class=\"placeholder\">" + (generalRecording && generalRecording.phase === "preparing" ? "Preparing…" : "Press keys…") + "</span>" : keycapsHtml(chord || button.value);
    button.setAttribute("aria-pressed", String(state === "recording" || state === "conflict"));
    button.setAttribute("aria-label", state === "recording" ? "Recording shortcut" : "Custom instruction hotkey, " + (hotkeyKeycapList(button.value).join(" ") || "none") + ". Press to record a new one.");
    if (hint) {
      hint.textContent = message || "Click, then press the new keys together.";
      hint.className = "field-hint recorder-hint" + (state === "saved" ? " saved" : state === "conflict" ? " conflict" : "");
    }
  }
  async function startGeneralRecording() {
    const button = $("#hotkey");
    if (!button || generalRecording || !configIsReady()) return;
    const session = { original: button.value, sessionId: "general-" + Date.now() + "-" + Math.random().toString(36).slice(2), phase: "preparing", timer: null, captured: null, renewing: false };
    generalRecording = session;
    button.focus();
    renderHotkeyRecorder("recording", "Preparing to record…");
    try {
      await updateShortcutLease(session.sessionId, true);
      if (generalRecording !== session) return;
      session.phase = "listening";
      renderHotkeyRecorder("recording", "Recording. Selara's own shortcuts are paused. Esc cancels.");
      session.timer = setInterval(async () => {
        if (session.renewing || generalRecording !== session) return;
        session.renewing = true;
        try { await updateShortcutLease(session.sessionId, true); }
        catch (e) {
          if (generalRecording === session) stopGeneralRecording("idle", "Recording stopped: " + e);
        } finally { session.renewing = false; }
      }, 700);
    } catch (e) {
      if (generalRecording === session) stopGeneralRecording("idle", "Could not record a shortcut: " + e);
    }
  }
  function stopGeneralRecording(state, message) {
    const session = generalRecording;
    if (!session) return;
    generalRecording = null;
    clearInterval(session.timer);
    renderHotkeyRecorder(state || "idle", message);
    updateShortcutLease(session.sessionId, false).catch(() => {});
  }
  // Like the command editor's recorder: keys are only captured while #hotkey
  // has focus; Tab and Shift-Tab stop recording and move focus as usual.
  function generalRecorderKeydown(ev) {
    const session = generalRecording;
    if (!session) return;
    const button = $("#hotkey");
    if (!button || document.activeElement !== button) { stopGeneralRecording("idle"); return; }
    const bare = !ev.ctrlKey && !ev.altKey && !ev.metaKey && !ev.shiftKey;
    if (ev.key === "Tab" && !ev.ctrlKey && !ev.altKey && !ev.metaKey) { stopGeneralRecording("idle"); return; }
    ev.preventDefault();
    ev.stopImmediatePropagation();
    if (ev.key === "Escape" && bare) { stopGeneralRecording("idle", "Recording cancelled."); return; }
    if (session.phase !== "listening" || ev.repeat) return;
    if (["Control", "Alt", "Shift", "Meta", "CapsLock", "Fn"].includes(ev.key)) return;
    const chord = shortcutFromEvent(ev);
    if (!chord) { renderHotkeyRecorder("recording", "Use ⌘, ⌃, or ⌥ with a key, or a function key."); return; }
    const conflict = generalHotkeyConflict(chord);
    if (conflict) { renderHotkeyRecorder("conflict", conflict, chord); return; }
    session.captured = chord;
    session.phase = "captured";
    $("#hotkey").innerHTML = keycapsHtml(chord);
  }
  function generalRecorderKeyup(ev) {

    const chord = session.captured;

  function syncLanguagePicker(value) {
    const info = languageInfo(value);
    const picker = $("#language-picker");
    const code = $("#language-code");

  function wireLanguageCombo() {
    const picker = $("#language-picker");
    const list = $("#language-list");
    const hidden = $("#language");
    if (!picker || !list || !hidden) return;
    let options = [];
    let active = -1;
    let freeEntry = false;
    const optionId = (i) => "language-option-" + i;
    const close = (restore) => {
      list.hidden = true;
      picker.setAttribute("aria-expanded", "false");
      picker.removeAttribute("aria-activedescendant");
      freeEntry = false;

      list.querySelectorAll("[role=option]").forEach((el, k) => el.setAttribute("aria-selected", String(k === active)));
      if (active >= 0) {
        picker.setAttribute("aria-activedescendant", optionId(active));
        const el = $("#" + optionId(active));

      }
    };
    const open = (query) => {
      const q = freeEntry ? "" : String(query || "").trim();
      const current = languageInfo(hidden.value);
      options = q ? languageMatches(q).map((l) => ({ value: l.code, name: l.name, code: l.code })) : LANGUAGES.map((l) => ({ value: l.code, name: l.name, code: l.code }));
      if (!q && !current.known && current.code) options.unshift({ value: current.code, name: current.name, code: "current" });
      const typed = String(query || "").trim();
      if (typed && !options.some((o) => o.name.toLowerCase() === typed.toLowerCase() || o.code.toLowerCase() === typed.toLowerCase())) options.push({ value: typed, name: "Use “" + typed + "”", code: "other" });
      if (!typed) options.push({ value: "", name: "Other…", code: "", other: true });
      list.innerHTML = options.map((o, i) => "<li role=\"option\" id=\"" + optionId(i) + "\" data-index=\"" + i + "\" aria-selected=\"false\"><span>" + escapeHtml(o.name) + "</span><span>" + escapeHtml(o.code) + "</span></li>").join("");

      const o = options[i];

    picker.addEventListener("input", () => { if (freeEntry) return; open(picker.value); });
    picker.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {

        ev.preventDefault();

    // when it names a language or is a plausible custom one; else it reverts.

  function syncProviderHealth() {
    const strip = $("#provider-health");
    if (!strip) return;
    const choice = selectedProviderChoice();
    const kind = USAGE_KIND_FOR_CHOICE[choice.id];
    const providers = usageSummary && Array.isArray(usageSummary.providers) ? usageSummary.providers : null;
    const activity = providers ? providers.find((p) => p.kind === kind) : null;
    const loading = !usageSummary;
    const quiet = (text) => '<div class="v quiet">' + escapeHtml(text) + "</div>";
    const last = activity && activity.last_ts
      ? '<div class="v">' + escapeHtml(relativeTime(activity.last_ts, Math.floor(Date.now() / 1000))) + '</div><div class="s">' + escapeHtml(historyDayLabel(activity.last_ts, Math.floor(Date.now() / 1000)) + ", " + new Date(activity.last_ts * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })) + "</div>"
      : quiet(loading ? "—" : "Never") + '<div class="s">' + (loading ? "Loading…" : "No requests yet") + "</div>";
    const recent = activity && Array.isArray(activity.recent_ms) ? activity.recent_ms.slice(-20).map(Number).filter((n) => Number.isFinite(n) && n >= 0) : [];
    const timed = activity && activity.median_ms !== null && activity.median_ms !== undefined;
    const peak = Math.max(1, ...recent);
    const median = timed
      ? '<div class="v">' + escapeHtml(fmtMs(activity.median_ms)) + '</div><div class="health-spark" role="img" aria-label="' + escapeAttr("Last " + recent.length + " request times") + '">' + recent.map((ms) => '<i style="height:' + Math.max(8, (ms / peak) * 100) + '%" title="' + escapeAttr(fmtMs(ms)) + '"></i>').join("") + "</div>"
      : quiet("No timing yet") + '<div class="health-spark empty" aria-hidden="true"></div>';
    const month = activity && activity.last_30_days ? activity.last_30_days : null;
    const requests = month ? Number(month.requests) || 0 : 0;
    const monthCost = month ? (roundedCost(month.cost_usd) || (Number(month.unpriced) ? "free/local" : "")) : "";
    const thirty = requests
      ? '<div class="v">' + fmtCount(requests) + " <small>" + (requests === 1 ? "request" : "req") + '</small></div><div class="s">' + escapeHtml(monthCost || "cost not reported") + "</div>"
      : quiet(loading ? "—" : "0 req") + '<div class="s">' + (loading ? "Loading…" : "Nothing yet") + "</div>";
    strip.innerHTML =
      '<div class="health-tile" id="provider-health-last"><div class="l">Last request</div>' + last + "</div>" +
      '<div class="health-tile" id="provider-health-median"><div class="l">Median time</div>' + median + "</div>" +
      '<div class="health-tile" id="provider-health-month"><div class="l">Last 30 days</div>' + thirty + "</div>";
    strip.dataset.state = timed ? "timed" : (activity ? "untimed" : "idle");

  // Try-it pad (design 3C): runs a command's prompt on sample text through
  // the active provider (try_command) and shows the rewrite as a word diff.
  // Status opens one from "Try it…"; the command editor embeds a compact one.
  const TRY_FALLBACK_SAMPLE = "hey can u send the numbers asap";
  const RELOAD_SVG =
    "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M13 8a5 5 0 1 1-1.6-3.7\"/><path d=\"M13 2.5v3h-3\"/></svg>";
  function trySamples() {
    const seen = new Set();
    const out = [];
    for (const h of historyEntries || []) {
      const text = String((h && h.original) || "").trim();
      if (text && text.length <= 800 && !seen.has(text)) { seen.add(text); out.push(text); }
    }
    return out.length ? out : [TRY_FALLBACK_SAMPLE];
  }
  function fmtSeconds(ms) {
    const s = Math.max(0, Number(ms) || 0) / 1000;
    return (s < 10 ? s.toFixed(1) : Math.round(s)) + " s";
  }
  function tryModelLabel(cmd) {

  }
  function tryPadMarkup(id, opts) {
    const fromHistory = (historyEntries || []).some((h) => h && String(h.original || "").trim());
    const sample = trySamples()[0];
    return (
      "<div class=\"try-pad" + (opts.compact ? " compact" : "") + "\" id=\"" + id + "\" data-sample=\"0\">" +
      (opts.heading
        ? "<div class=\"try-head\"><h2>Try a command</h2><p class=\"field-hint\">Uses your active connection, so nothing is pasted anywhere. Counts toward Usage.</p></div>"
        : "") +
      (opts.chips ? "<div class=\"try-chips\" role=\"group\" aria-label=\"Command to try\"></div>" : "") +
      "<div class=\"try-grid\">" +
      "<div class=\"try-box\"><div class=\"try-lbl\"><span class=\"try-src\">" + (opts.compact ? (fromHistory ? "Sample · from History" : "Sample") : "Your text") + "</span>" +
      (opts.compact
        ? "<button type=\"button\" class=\"btn linkish try-next\" title=\"Another sample from History\" aria-label=\"Another sample\">" + RELOAD_SVG + "</button>"
        : "<span class=\"try-count\"></span>") +
      "</div><textarea class=\"try-text\" rows=\"2\" aria-label=\"Sample text\" spellcheck=\"false\">" + escapeHtml(sample) + "</textarea></div>" +
      "<div class=\"try-box\"><div class=\"try-lbl\"><span class=\"try-meta\">Result</span>" +
      "<button type=\"button\" class=\"btn linkish run try-run\" title=\"Run on the sample (⌘R). Spends tokens and counts toward Usage.\">" + (opts.compact ? "Run" : "Run ⌘R") + "</button></div>" +
      "<div class=\"try-result placeholder\" aria-live=\"polite\">" + (opts.compact ? "Run (⌘R) to see this prompt’s rewrite." : "Pick a command to run it on your text.") + "</div></div>" +
      "</div>" +
      (opts.compact ? "" : "<div class=\"try-foot\"><p class=\"field-hint\">Each run spends tokens on the active connection and counts toward Usage.</p></div>") +
      "</div>"
    );
  }
  function wireTryPad(root, opts) {
    if (!root) return;
    root._tryOpts = opts;
    const text = root.querySelector(".try-text");
    const grow = () => {
      text.style.height = "auto";
      text.style.height = Math.max(48, text.scrollHeight) + "px";
      const count = root.querySelector(".try-count");
      if (count) count.textContent = text.value.length + (text.value.length === 1 ? " char" : " chars");
    };
    text.addEventListener("input", () => { text.dataset.edited = "true"; grow(); });
    root._grow = grow;
    requestAnimationFrame(grow);
    // A pad rendered on a hidden page measures 0; size it once it shows.
    if (typeof ResizeObserver === "function") new ResizeObserver(() => requestAnimationFrame(() => { if (text.offsetWidth && text.scrollHeight > text.clientHeight + 1) grow(); })).observe(text);
    root.querySelector(".try-run").onclick = () => runTryPad(root);
    const next = root.querySelector(".try-next");
    if (next) next.onclick = () => {
      const samples = trySamples();
      const i = (Number(root.dataset.sample) + 1) % samples.length;
      root.dataset.sample = String(i);
      text.value = samples[i];
      grow();
    };
    const chips = root.querySelector(".try-chips");
    if (chips && opts.chips) {
      const all = config.commands || [];
      const selected = opts.selectedId() || (all[0] && all[0].id);
      chips.innerHTML = all.length
        ? all.map((c) => "<button type=\"button\" class=\"btn" + (c.id === selected ? "" : " secondary") + "\" data-id=\"" + escapeAttr(c.id) + "\" aria-pressed=\"" + (c.id === selected) + "\">" + commandTileHtml(c, "sm") + escapeHtml(c.label) + "</button>").join("")
        : "<p class=\"field-hint\">No commands yet. Add one in Commands.</p>";
      chips.querySelectorAll("button[data-id]").forEach((chip) => {
        chip.onclick = () => {
          opts.onSelect(chip.dataset.id);
          chips.querySelectorAll("button[data-id]").forEach((b) => {

  // History loads after the first render; adopt its newest sample unless the

  function refreshTrySamples() {
    document.querySelectorAll(".try-pad").forEach((root) => {
      const text = root.querySelector(".try-text");
      if (!text || text.dataset.edited) return;
      const samples = trySamples();
      root.dataset.sample = "0";
      text.value = samples[0];
      const src = root.querySelector(".try-src");
      if (src && root.classList.contains("compact")) src.textContent = samples[0] === TRY_FALLBACK_SAMPLE ? "Sample" : "Sample · from History";
      if (root._grow) root._grow();
    });
  }
  async function runTryPad(root) {
    const opts = root && root._tryOpts;
    if (!opts) return;
    const cmd = opts.getCommand();
    const text = root.querySelector(".try-text").value;
    const out = root.querySelector(".try-result");
    const meta = root.querySelector(".try-meta");
    const run = root.querySelector(".try-run");
    const label = (cmd && String(cmd.label || "").trim()) || "New command";
    const seq = (root._seq = (root._seq || 0) + 1);
    out.className = "try-result";
    out.innerHTML = "<div class=\"try-skeleton\" role=\"status\" aria-label=\"Running…\"><i></i><i></i><i></i></div>";
    meta.textContent = opts.compact ? "Result · running…" : label + " · " + tryModelLabel(cmd);
    run.disabled = true;
    const started = performance.now();
    try {
      const reply = await invoke("try_command", { prompt: String((cmd && cmd.prompt) || ""), text, model: (cmd && cmd.model) || null });
      if (seq !== root._seq || !root.isConnected) return;
      const elapsed = Number(reply && reply.elapsed_ms);
      const seconds = fmtSeconds(Number.isFinite(elapsed) ? elapsed : performance.now() - started);
      const model = (reply && reply.model) || tryModelLabel(cmd);
      const provider = USAGE_PROVIDER_LABELS[reply && reply.provider] || (reply && reply.provider) || "";
      meta.textContent = opts.compact ? "Result · " + seconds : label + " · " + model + " · " + seconds;
      meta.title = [provider, model].filter(Boolean).join(" · ");
      out.innerHTML = wordDiffHtml(text, reply && reply.result);
      markProviderTested();
      // The run is in the usage ledger now; keep Status honest with it.
      refreshStatusUsage().then(syncStatusHero);
    } catch (e) {
      if (seq !== root._seq || !root.isConnected) return;
      meta.textContent = opts.compact ? "Result · didn’t run" : label + " · didn’t run";
      out.innerHTML = "<p class=\"try-error\" role=\"alert\">" + escapeHtml(String(e)) + "</p>";
    } finally {
      if (seq === root._seq) { run.disabled = false; run.textContent = opts.compact ? "Run" : "Run again ⌘R"; }
    }
  }

  // List-level failures (duplicate, delete from the list, import, reorder)
  // show above the list; editor failures show in the editor beside its fields.
  function setCommandError(message, where = "list") {
    if (where === "editor") commandEditorError = message; else commandError = message;
    const el = $(where === "editor" ? "#cmd-save-error" : "#commands-error");
    if (!el) return;
    if (where !== "editor" && !message && commandFailedDrafts.size) {
      const names = [...commandFailedDrafts.values()].map((f) => "“" + (f.draft.label || "New Command") + "”").join(", ");
      el.textContent = "Could not save " + names + ". " + commandFailedError + " ";
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "btn secondary";
      retry.id = "cmd-retry-save";
      retry.textContent = "Retry";
      retry.onclick = () => retryFailedCommandDrafts();
      el.appendChild(retry);
      el.hidden = false;
      return;

    el.textContent = message;

  function syncCommandBusy() {
    document.querySelectorAll('#cmd-new, #cmd-new-empty, #cmd-new-card, #cmd-import, #cmd-import-mode, .cmd-item .row-actions button, #cmd-editor input, #cmd-editor textarea, #cmd-editor button').forEach((el) => {

  // Command saves run in order. `build` receives the committed list when the
  // save actually starts (after any earlier save landed) and returns the next
  // list, or null when nothing changed.
  function saveCommands(build, opts = {}) {
    if (!ensureConfigReady()) return Promise.resolve(false);
    const where = opts.where || "list";
    const job = commandSaveChain.then(async () => {
      const next = typeof build === "function" ? build(config.commands || []) : build;
      if (!next) return true;
      setCommandError("", where);
      if (opts.field) nextSaveField = opts.field;
      // Only saveSection's successful response updates the committed config.
      // Failed drafts must never appear in the list or a later mutation.
      return saveSection("commands", next, opts.onError || ((error) => setCommandError("Could not save commands. " + String(error), where)));
    });
    commandSaveChain = job.catch(() => false);
    return job;
  }

  // Duplicate, delete, and import run one at a time and lock the list.
  async function runCommandOperation(build, opts) {
    if (!ensureConfigReady() || commandOperationPending) return false;
    commandOperationPending = true;
    setCommandError("", (opts && opts.where) || "list");
    syncCommandBusy();
    try {
      return await saveCommands(build, opts);
    } finally {
      commandOperationPending = false;
      syncCommandBusy();
    }
  }

        const path = await invoke("export_commands");
        setStatus(path ? "Exported commands" : "Export cancelled");
      } catch (e) {
        setStatus(String(e), "error");
      }
    };
    $("#cmd-import").onclick = async () => {
      if (!ensureConfigReady() || commandOperationPending) return;
      const mode = $("#cmd-import-mode").value;
      commandOperationPending = true;
      setCommandError("");
      syncCommandBusy();
      setStatus("Choose a command pack…");
      try {
        const report = await invoke("import_commands", { mode });
        if (!report) { setStatus("Import cancelled"); return; }
        config = normalizeConfigForUi(await invoke("get_config"));
        commandOperationPending = false;
        renderCommands();
        const parts = [];
        if (report.added) parts.push(report.added + " added");
        if (report.replaced) parts.push(report.replaced + " replaced");
        if (report.skipped) parts.push(report.skipped + " skipped");
        if (report.renamed && report.renamed.length) parts.push(report.renamed.length + " renamed");
        if (report.hotkeys_dropped) parts.push(report.hotkeys_dropped + " hotkey(s) dropped (already in use)");
        setStatus("Imported: " + (parts.join(", ") || "nothing to do"));
      } catch (e) {
        setStatus(String(e), "error");
        setCommandError("Could not import commands. " + String(e));
      } finally {
        commandOperationPending = false;
        syncCommandBusy();
      }
    };
    if (list) {
      const search = $("#cmd-search");
      search.oninput = () => {
        commandFilter = search.value;
        renderCommandRows();
      };
      search.onkeydown = (ev) => {
        if (ev.key === "ArrowDown") {
          const first = $(".cmd-rows .cmd-item");
          if (first) { ev.preventDefault(); selectCommand(first.dataset.id, "row"); }
        }
      };
      wireCommandRows();
      wireCommandEditor();
    } else {
      wireShelf();
    }
    syncCommandBusy();
  }

  function renderCommandRows() {
    const rows = $("#section-commands .cmd-rows");
    if (!rows) return;
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest(".cmd-item");
    const focusId = focused && rows.contains(focused) ? focused.dataset.id : null;
    rows.innerHTML = commandRowsHtml();
    wireCommandRows();
    syncCommandBusy();
    if (focusId !== null) {
      const again = Array.from(rows.querySelectorAll(".cmd-item")).find((el) => el.dataset.id === focusId);
      if (again) again.focus();
    }
  }

  function renderCommandEditor() {
    const editor = $("#cmd-editor");
    if (!editor) return;
    closeIdentityPop();
    editor.innerHTML = commandEditorInner();
    wireCommandEditor();
    syncCommandBusy();
  }

  // Rows, then the editor (only when its command changed), or the shelf.
  function refreshCommandViews(editorToo) {
    if (commandView === "grid") { renderCommands(); return; }
    renderCommandRows();
    if (editorToo) renderCommandEditor();
  }

  function commandMenu(id, el) {
    const enabled = canEditCommands();
    showNativeMenu([
      { text: "Edit…", enabled, action: () => editCommand(id) },
      { text: "Duplicate", enabled, action: () => duplicateCommand(id, el) },
      "-",
      { text: "Delete…", enabled, action: () => deleteCommand(id, el, "list") },
    ]);
  }

  function wireCommandRows() {
    document.querySelectorAll("#section-commands .cmd-item").forEach((el) => {
      const id = el.dataset.id;
      if (el.classList.contains("draft")) {
        el.onclick = () => { const label = $("#cmd-label"); if (label) label.focus(); };
        return;
      }
      el.onclick = (ev) => {
        if (ev.target.closest(".row-actions") || !configIsReady()) return;
        selectCommand(id, "row");
      };
      el.onkeydown = (ev) => {
        if (ev.target !== el) return;
        const rows = Array.from(document.querySelectorAll("#section-commands .cmd-item:not(.draft)"));
        const index = rows.indexOf(el);
        if (ev.altKey && (ev.key === "ArrowUp" || ev.key === "ArrowDown")) {
          ev.preventDefault();
          if (!commandFilter.trim()) moveCommand(id, ev.key === "ArrowUp" ? -1 : 1);
          return;
        }
        const target = { ArrowDown: rows[index + 1], ArrowUp: rows[index - 1], Home: rows[0], End: rows[rows.length - 1] }[ev.key];
        if (target !== undefined) {
          ev.preventDefault();
          if (target) selectCommand(target.dataset.id, "row");
          return;
        }
        if (!canEditCommands()) return;
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectCommand(id, "label"); }
      };
      el.querySelector('[data-act="dup"]').onclick = async (ev) => {
        ev.stopPropagation();
        await duplicateCommand(id, ev.currentTarget);
      };
      el.querySelector('[data-act="del"]').onclick = async (ev) => {
        ev.stopPropagation();
        await deleteCommand(id, ev.currentTarget, "list");
      };
      el.oncontextmenu = (ev) => { ev.preventDefault(); commandMenu(id, el); };
    });
  }

  function selectCommand(id, focus) {
    if (commandDraftNew || id !== selectedCommandId) {
      stopShortcutRecording();
      commandDraftNew = false;
      selectedCommandId = id;
      editingId = id;
      commandEditorError = "";
      renderCommandRows();
      renderCommandEditor();
    }
    if (focus === "row") {
      const row = Array.from(document.querySelectorAll("#section-commands .cmd-item")).find((el) => el.dataset.id === id);
      if (row) row.focus();
    } else if (focus === "label" && $("#cmd-label")) {
      $("#cmd-label").focus();
    }
  }

  // "Edit…" from a menu or a card: open the command in the list editor.
  function editCommand(id) {
    if (!configIsReady()) return;
    if (commandView === "grid") {
      commandView = "list";
      commandDraftNew = false;
      selectedCommandId = id;
      renderCommands();
    }
    selectCommand(id, "label");
  }

  function startNewCommand() {
    if (!canEditCommands()) return;
    stopShortcutRecording();
    if (commandView === "grid") { commandView = "list"; renderCommands(); }
    commandDraftNew = true;
    selectedCommandId = null;
    editingId = null;
    commandEditorError = "";
    if (commandFilter) { commandFilter = ""; const search = $("#cmd-search"); if (search) search.value = ""; }
    renderCommandEditor();
    renderCommandRows();
    $("#cmd-label").focus();
  }

  function editorDraft() {
    const editor = $("#cmd-editor");
    return {
      label: $("#cmd-label").value.trim(),
      prompt: $("#cmd-prompt").value.trim(),
      hotkey: String($("#cmd-hotkey").value || "").trim() || null,
      model: $("#cmd-model").value.trim() || null,
      apps: parseAppList($("#cmd-apps").value),
      review: $("#cmd-review").checked,
      glyph: (editor && editor.dataset.glyph) || null,
      color: (editor && editor.dataset.color) || null,
    };
  }
  function applyCommandDraft(base, d) {
    const next = Object.assign({}, base, { label: d.label, prompt: d.prompt, kind: "replace", hotkey: d.hotkey, model: d.model, apps: d.apps });
    if (d.review) next.review = true; else delete next.review;
    if (d.glyph) next.glyph = d.glyph; else delete next.glyph;
    if (d.color) next.color = d.color; else delete next.color;
    return next;
  }

  // The list change that saves draft `d` for command `id`, or null when
  // nothing changed. A create adds the command if it isn't there yet.
  function commandDraftBuild(id, d, creating) {
    return (cmds) => {
      const index = cmds.findIndex((c) => c.id === id);
      if (index < 0) return creating ? [...cmds, applyCommandDraft({ id }, d)] : null;
      const next = applyCommandDraft(cmds[index], d);
      if (JSON.stringify(next) === JSON.stringify(cmds[index])) return null;
      const copy = cmds.slice();
      copy[index] = next;
      return copy;
    };
  }
  function withFailedDraft(c) {
    const failed = c && c.id ? commandFailedDrafts.get(c.id) : null;
    return failed ? applyCommandDraft(c, failed.draft) : c;
  }
  // A failed editor save reports in the editor only while that command is
  // still the one open; otherwise above the list, naming it, with Retry.
  function reportCommandSaveFailure(id, d, creating, error) {
    if (!commandDraftNew && selectedCommandId === id && $("#cmd-label")) {
      setCommandError("Could not save commands. " + String(error), "editor");
      return;
    }
    commandFailedDrafts.set(id, { draft: d, creating });
    commandFailedError = String(error);
    setCommandError("", "list");
  }
  async function retryFailedCommandDrafts() {
    const entries = [...commandFailedDrafts.entries()];
    commandFailedDrafts.clear();
    setCommandError("", "list");
    let editorToo = false;
    for (const [id, f] of entries) {
      const saved = await saveCommands(commandDraftBuild(id, f.draft, f.creating), {
        where: "list",
        onError: (error) => { commandFailedDrafts.set(id, f); commandFailedError = String(error); setCommandError("", "list"); },
      });
      if (saved && id === selectedCommandId) editorToo = true;
    }
    refreshCommandViews(editorToo);
  }

  function invalidCommandField(el, message) {
    showFieldError(el, message);
  }

  // Save-as-you-go: each committed field writes the whole editor draft. A
  // new command is created once it has both a label and a prompt.
  async function commitCommandEditor(field) {
    if (!configIsReady() || !$("#cmd-label")) return false;
    const d = editorDraft();
    const creating = commandDraftNew;
    if (!creating) {
      if (!d.label) { invalidCommandField($("#cmd-label"), "A command needs a label."); return false; }
      if (!d.prompt) { invalidCommandField($("#cmd-prompt"), "A command needs a prompt."); return false; }
    } else if (!d.label || !d.prompt) {
      renderCommandRows();
      return false;
    }
    const conflict = shortcutConflict(d.hotkey);
    if (conflict) { renderShortcutRecorder(conflict); shakeField($("#cmd-hotkey")); return false; }
    clearFieldErrors("#cmd-editor");
    const id = creating ? slug(d.label) + "-" + Math.random().toString(36).slice(2, 7) : editingId;
    if (creating) {
      // Claim the id now so a second commit while this one saves updates
      // the same new command instead of creating another.
      commandDraftNew = false;
      selectedCommandId = id;
      editingId = id;
    }
    const saved = await saveCommands(commandDraftBuild(id, d, creating), {
      where: "editor",
      field: field ? { el: field, inline: field.id === "cmd-hotkey" || field.id === "cmd-review" } : null,
      onError: (error) => reportCommandSaveFailure(id, d, creating, error),
    });
    if (saved && commandFailedDrafts.delete(id)) setCommandError(commandError, "list");
    if (saved) {
      refreshCommandViews(false);
      const del = $("#cmd-delete");
      if (del) del.hidden = false;
      const note = $("#cmd-editor-note");
      if (note) note.textContent = "Always replace the selected text. Use the target app’s native undo command to restore it.";
    } else if (creating && !commandById(id) && selectedCommandId === id) {
      commandDraftNew = true;
      selectedCommandId = null;
      editingId = null;
    }
    return saved;
  }

  function syncPromptField() {
    const ta = $("#cmd-prompt");
    const backdrop = $("#cmd-editor .prompt-backdrop");
    if (!ta || !backdrop) return;
    backdrop.innerHTML = escapeHtml(ta.value).replace(/\{\{\s*(language|app)\s*\}\}/g, (m) => "<mark>" + m + "</mark>") + "\n";
    ta.style.height = "auto";
    ta.style.height = Math.max(84, ta.scrollHeight) + "px";
  }

  function closeIdentityPop() {
    const pop = $("#cmd-identity-pop");
    if (pop && !pop.hidden) {
      pop.hidden = true;
      const btn = $("#cmd-glyph");
      if (btn) btn.setAttribute("aria-expanded", "false");
    }
  }
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest || ev.target.closest("#cmd-identity-pop, #cmd-glyph")) return;
    closeIdentityPop();
  });
  document.addEventListener("keydown", (ev) => {
    const pop = $("#cmd-identity-pop");
    if (ev.key !== "Escape" || !pop || pop.hidden || shortcutRecording) return;
    ev.preventDefault();
    closeIdentityPop();
    const btn = $("#cmd-glyph");
    if (btn) btn.focus();
  });

  function wireCommandEditor() {
    const editor = $("#cmd-editor");
    if (!editor || !$("#cmd-label")) {
      const empty = $("#cmd-new-empty");
      if (empty) empty.onclick = () => startNewCommand();
      return;
    }
    const c = commandDraftNew ? {} : withFailedDraft(commandById(selectedCommandId) || {});
    editor.dataset.glyph = String(c.glyph || "").trim();
    editor.dataset.color = String(c.color || "").trim().toLowerCase();
    setCommandError(commandEditorError, "editor");

    const label = $("#cmd-label");
    const prompt = $("#cmd-prompt");
    label.addEventListener("input", () => {
      if (commandDraftNew) {
        const name = document.querySelector(".cmd-item.draft .cmd-name");
        if (name) name.textContent = label.value.trim() || "New Command";
      }
      const tile = $("#cmd-glyph .glyph-tile");
      if (tile && !editor.dataset.glyph) tile.textContent = (Array.from(label.value.trim())[0] || (commandDraftNew ? "N" : "?")).toUpperCase();
    });
    prompt.addEventListener("input", syncPromptField);
    requestAnimationFrame(syncPromptField);
    if (typeof ResizeObserver === "function") new ResizeObserver(() => requestAnimationFrame(() => { if (prompt.offsetWidth && prompt.scrollHeight > prompt.clientHeight + 1) syncPromptField(); })).observe(prompt);
    syncPromptField();
    [label, prompt, $("#cmd-model"), $("#cmd-apps"), $("#cmd-review")].forEach((el) => {
      el.addEventListener("change", (ev) => commitCommandEditor(ev.currentTarget));
      el.addEventListener("input", () => {
        el.classList.remove("field-invalid");
        const field = el.closest(".prompt-field");
        if (field) field.classList.remove("field-invalid");
      });
    });
    // ⌘↩ commits the field without leaving it.
    [label, prompt, $("#cmd-model"), $("#cmd-apps")].forEach((el) => {
      el.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); commitCommandEditor(el); }
      });
    });
    editor.querySelectorAll("button.tok[data-insert]").forEach((btn) => {
      btn.onclick = () => {
        const token = btn.dataset.insert;
        const start = typeof prompt.selectionStart === "number" ? prompt.selectionStart : prompt.value.length;
        const end = typeof prompt.selectionEnd === "number" ? prompt.selectionEnd : start;
        const before = prompt.value.slice(0, start);
        const pad = before && !/\s$/.test(before) ? " " : "";
        prompt.value = before + pad + token + prompt.value.slice(end);
        const caret = start + pad.length + token.length;
        prompt.focus();
        try { prompt.setSelectionRange(caret, caret); } catch (_) {}
        syncPromptField();
        commitCommandEditor(prompt);
      };
    });
    $("#cmd-advanced").addEventListener("toggle", (ev) => { commandAdvancedOpen = ev.currentTarget.open; });

    renderShortcutRecorder();
    const hotkey = $("#cmd-hotkey");
    hotkey.onclick = startShortcutRecording;
    hotkey.onblur = () => stopShortcutRecording();
    $("#cmd-hotkey-clear").onclick = () => {
      stopShortcutRecording();
      const had = hotkey.value;
      hotkey.value = "";
      renderShortcutRecorder("Shortcut cleared.");
      hotkey.focus();
      if (had) commitCommandEditor(hotkey);
    };

    // Icon and color: picking either saves at once.
    const glyphBtn = $("#cmd-glyph");
    const pop = $("#cmd-identity-pop");
    glyphBtn.onclick = () => {
      const open = pop.hidden;
      pop.hidden = !open;
      glyphBtn.setAttribute("aria-expanded", String(open));
      if (open) {
        const pressed = pop.querySelector('.glyph-grid [aria-pressed="true"]') || pop.querySelector("button");
        if (pressed) pressed.focus();
      }
    };
    pop.onkeydown = (ev) => {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); closeIdentityPop(); glyphBtn.focus(); }
    };
    pop.querySelectorAll("button").forEach((btn) => {
      btn.onclick = () => {
        const isGlyph = btn.hasAttribute("data-glyph");
        if (isGlyph) editor.dataset.glyph = btn.dataset.glyph; else editor.dataset.color = btn.dataset.color;
        pop.querySelectorAll(isGlyph ? ".glyph-grid button" : ".swatches button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        const draftCmd = { id: commandDraftNew ? "new" : editingId, label: label.value, glyph: editor.dataset.glyph, color: editor.dataset.color };
        glyphBtn.innerHTML = commandTileHtml(draftCmd);
        if (commandDraftNew) renderCommandRows();
        commitCommandEditor(label);
      };
    });

    const del = $("#cmd-delete");
    if (del) del.onclick = async () => {
      if (!(await deleteCommand(editingId, del, "editor")) && del.isConnected && !del.disabled) del.focus();
    };

    wireTryPad($("#cmd-try"), {
      compact: true,
      getCommand: () => ({
        label: label.value.trim() || "New command",
        prompt: prompt.value,
        model: $("#cmd-model").value.trim() || null,
      }),
    });
  }

  // Card shelf: pointer drag with a lift and a spring settle; ⌥↑/⌥↓ for the
  // keyboard. The order saves through the same commands path as edits.
  function cardOrder(grid) {
    return Array.from(grid.querySelectorAll(".cmd-card[data-id]")).map((c) => c.dataset.id);
  }
  // FLIP: move the DOM, then animate the cards that shifted from where they were.
  function flipCards(grid, mutate, skip) {
    const cards = Array.from(grid.querySelectorAll(".cmd-card"));
    const before = new Map(cards.map((c) => [c, [c.offsetLeft, c.offsetTop]]));
    mutate();
    for (const card of cards) {
      if (card === skip) continue;
      const [x, y] = before.get(card);
      const dx = x - card.offsetLeft;
      const dy = y - card.offsetTop;
      if (!dx && !dy) continue;
      card.classList.remove("flip");
      card.style.transform = "translate(" + dx + "px, " + dy + "px)";
      void card.offsetWidth;
      card.classList.add("flip");
      card.style.transform = "";
      card.addEventListener("transitionend", () => card.classList.remove("flip"), { once: true });
    }
  }
  function announceCommandMove(id, ids) {
    const live = $("#cmd-live");
    const c = commandById(id);
    if (live && c) live.textContent = "Moved " + c.label + " to position " + (ids.indexOf(id) + 1) + " of " + ids.length + ".";
  }
  let commandOrderSeq = 0;
  async function saveCommandOrder(ids) {
    const seq = ++commandOrderSeq;
    const saved = await saveCommands((cmds) => {
      const byId = new Map(cmds.map((c) => [c.id, c]));
      const next = ids.map((id) => byId.get(id)).filter(Boolean);
      cmds.forEach((c) => { if (!ids.includes(c.id)) next.push(c); });
      return next.every((c, i) => c === cmds[i]) ? null : next;
    }, { where: "list" });
    if (!saved) {
      // Put the cards back where the saved config has them.
      refreshCommandViews(false);
    } else if (commandView !== "grid" && seq === commandOrderSeq) {
      // Only the last pending move re-renders, so rows don't jump back to an
      // older saved order while a later move is still on its way.
      renderCommandRows();
    }
    return saved;
  }
  function moveCommand(id, delta) {
    if (!configIsReady()) return;
    const grid = $("#cmd-grid");
    const rows = $("#section-commands .cmd-rows");
    // The on-screen order already includes moves whose saves haven't landed.
    const ids = grid ? cardOrder(grid)
      : rows ? Array.from(rows.querySelectorAll(".cmd-item[data-id]:not(.draft)")).map((el) => el.dataset.id)
      : (config.commands || []).map((c) => c.id);
    const from = ids.indexOf(id);
    const to = Math.max(0, Math.min(ids.length - 1, from + delta));
    if (from < 0 || from === to) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    if (grid) {
      const card = Array.from(grid.querySelectorAll(".cmd-card[data-id]")).find((el) => el.dataset.id === id);
      flipCards(grid, () => {
        const ref = grid.querySelectorAll(".cmd-card[data-id]")[to];
        if (to > from) ref.after(card); else ref.before(card);
      }, null);
      card.focus();
      renderMenuPreview(ids, id);
    } else {
      const row = rows && Array.from(rows.querySelectorAll(".cmd-item")).find((el) => el.dataset.id === id);
      const ref = rows && rows.querySelectorAll(".cmd-item:not(.draft)")[to];
      if (row && ref) { if (to > from) ref.after(row); else ref.before(row); row.focus(); }
    }
    announceCommandMove(id, ids);
    saveCommandOrder(ids);
  }

  function startCardDrag(ev) {
    const card = ev.target.closest(".cmd-card[data-id]");
    if (!card || ev.button !== 0) return;
    const grid = card.parentElement;
    const sx = ev.clientX;
    const sy = ev.clientY;
    let drag = null;
    const move = (e) => {
      if (!drag) {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) < 5 || !canEditCommands()) return;
        const g = grid.getBoundingClientRect();
        drag = { before: cardOrder(grid), ox: sx - g.left - card.offsetLeft, oy: sy - g.top - card.offsetTop };
        card.classList.remove("settling", "flip");
        card.classList.add("lifted");
        renderMenuPreview(drag.before, card.dataset.id);
      }
      e.preventDefault();
      const g = grid.getBoundingClientRect();
      const px = e.clientX - g.left;
      const py = e.clientY - g.top;
      const over = Array.from(grid.querySelectorAll(".cmd-card[data-id]")).find((o) => o !== card &&
        px >= o.offsetLeft && px <= o.offsetLeft + o.offsetWidth && py >= o.offsetTop && py <= o.offsetTop + o.offsetHeight);
      if (over) {
        const cards = Array.from(grid.querySelectorAll(".cmd-card[data-id]"));
        const forward = cards.indexOf(card) < cards.indexOf(over);
        flipCards(grid, () => { if (forward) over.after(card); else over.before(card); }, card);
        renderMenuPreview(cardOrder(grid), card.dataset.id);
      }
      const tx = px - drag.ox - card.offsetLeft;
      const ty = py - drag.oy - card.offsetTop;
      card.style.transform = "translate(" + tx + "px, " + ty + "px) rotate(-2deg) scale(1.04)";
    };
    const end = (e) => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", end);
      if (!drag) {
        if (e.type === "pointerup") editCommand(card.dataset.id);
        return;
      }
      card.classList.remove("lifted");
      card.classList.add("settling");
      card.style.transform = "";
      card.addEventListener("transitionend", () => card.classList.remove("settling"), { once: true });
      const ids = cardOrder(grid);
      renderMenuPreview(ids, null);
      if (ids.join("\n") !== drag.before.join("\n")) {
        announceCommandMove(card.dataset.id, ids);
        saveCommandOrder(ids);
      }
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  }

  function wireShelf() {
    const grid = $("#cmd-grid");
    if (!grid) return;
    grid.onpointerdown = startCardDrag;
    grid.querySelectorAll(".cmd-card[data-id]").forEach((card) => {
      const id = card.dataset.id;
      card.onkeydown = (ev) => {
        if (ev.target !== card) return;
        const arrows = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 };
        if (ev.key in arrows) {
          ev.preventDefault();
          if (ev.altKey) { if (canEditCommands()) moveCommand(id, arrows[ev.key]); return; }
          const cards = Array.from(grid.querySelectorAll(".cmd-card[data-id]"));
          const next = cards[cards.indexOf(card) + arrows[ev.key]];
          if (next) next.focus();
          return;
        }
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); editCommand(id); }
      };
      card.oncontextmenu = (ev) => { ev.preventDefault(); commandMenu(id, card); };
    });
    $("#cmd-new-card").onclick = () => startNewCommand();
  }

  async function duplicateCommand(id, opener) {
    if (!ensureConfigReady() || commandOperationPending) return;
    const src = commandById(id);
    if (!src) return;
    const duplicate = Object.assign({}, src, {
      id: src.id + "-copy-" + Math.random().toString(36).slice(2, 6),
      label: src.label + " copy",
      kind: "replace",
      hotkey: null,
    });
    if (await runCommandOperation((cmds) => [...cmds, duplicate], { where: "list" })) refreshCommandViews(false);
    restoreCommandFocus(opener);
  }

        : t.op === "del" ? "<del>" + escapeHtml(t.text) + "</del>" : "<ins>" + escapeHtml(t.text) + "</ins>").join("") + "</p>";
    }
    return "<p class=\"hx-text result-only\">" + escapeHtml(String(entry.result || "").trim() || "(empty)") + "</p>" +
      (String(entry.original || "").trim() ? "<details class=\"hx-orig\"><summary>Show original</summary><p>" + escapeHtml(String(entry.original).trim()) + "</p></details>" : "");
  }
  function historyMatches(entry, filter, query) {
    if (filter === "attention" && !historyIsProblem(entry)) return false;
    if (filter.startsWith("app:") && (entry.app || "") !== filter.slice(4)) return false;
    if (!query) return true;
    return [entry.label, entry.command_id, entry.app, entry.original, entry.result].join("\n").toLowerCase().includes(query);
  }
  function historyEntryHtml(h, i, now) {
    const cmd = (config.commands || []).find((c) => c.id === h.command_id);
    const identity = historyCommandIdentity(cmd, h.command_id, h.label);
    const problem = historyIsProblem(h);
    const outcome = historyOutcomeText(h);
    const badge = outcome
      ? "<span class=\"badge warn\" title=\"" + escapeAttr(historyKindLabel(h)) + "\">" + escapeHtml(outcome) + "</span>"
      : (historyIsLegacy(h) ? "<span class=\"badge neutral\">Legacy result</span>" : "");
    const when = h.ts ? new Date(h.ts * 1000).toLocaleString() : "";
    // Problem entries make Copy result the default (primary) button; every
    // entry has the pull-down arrow, so Copy Original is reachable by keyboard.
    const actions = (problem
      ? "<button type=\"button\" class=\"btn split\" data-act=\"copy-result\" title=\"Copy the result to the clipboard\">Copy result</button>"
      : "<button type=\"button\" class=\"btn secondary split\" data-act=\"copy-result\" title=\"Copy the result to the clipboard\">Copy</button>") +
      "<button type=\"button\" class=\"btn" + (problem ? "" : " secondary") + "\" data-act=\"copy-menu\" aria-haspopup=\"menu\" aria-label=\"More copy options\" title=\"Copy the result or the original\">" + PULLDOWN_SVG + "</button>";
    return "<div class=\"hist-item" + (problem ? " problem" : "") + "\" data-index=\"" + i + "\">" +
      "<span class=\"hx-ic\" style=\"background:" + escapeAttr(identity.color) + "\" aria-hidden=\"true\">" + escapeHtml(identity.glyph) + "</span>" +
      "<div class=\"hist-main\"><h3 class=\"hx-meta\"><b class=\"hist-name\">" + escapeHtml(h.label || h.command_id || "Command") + "</b>" +
      (h.app ? "<span>· " + escapeHtml(h.app) + "</span>" : "") +
      "<span class=\"hist-meta\" title=\"" + escapeAttr(when) + "\">· " + escapeHtml(relativeTime(h.ts, now)) + "</span>" + badge + "</h3>" +
      historyDiffHtml(h) + "</div>" +
      "<div class=\"row-actions\">" + actions + "</div></div>";
  }
  function renderHistoryList() {
    const list = $("#history-list");
    if (!list) return;
    const now = Math.floor(Date.now() / 1000);
    const query = historyQuery.trim().toLowerCase();
    const shown = historyEntries.map((h, i) => [h, i]).filter(([h]) => historyMatches(h, historyFilter, query));
    document.querySelectorAll("#history-chips .hx-chip").forEach((chip) => chip.setAttribute("aria-pressed", String(chip.dataset.filter === historyFilter)));
    if (historyError) {
      list.innerHTML = "<div class=\"hx-group hx-empty\"><strong>Could not read history</strong><span>" + escapeHtml(historyError) + "</span></div>";
      return;
    }
    if (!historyEntries.length) {
      list.innerHTML =
        "<div class=\"hx-group hx-empty\"><span class=\"hx-empty-art\">" + HX_EMPTY_SVG + "</span><strong>No rewrites yet</strong>" +
        "<span>Select text in any app and run a command. Each rewrite shows up here with exactly what changed, newest first.</span>" +
        "<span class=\"hx-sample\" aria-hidden=\"true\">Thanks for <del>you're</del> <ins>your</ins> help</span></div>";
      return;
    }
    if (!shown.length) {
      list.innerHTML = "<div class=\"hx-group hx-empty\"><strong>No matching rewrites</strong><span>Try another search or filter.</span></div>";
      return;
    }
    const groups = [];
    for (const [h, i] of shown) {
      const day = historyDayLabel(h.ts, now);
      if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, items: [] });
      groups[groups.length - 1].items.push(historyEntryHtml(h, i, now));
    }
    list.innerHTML = groups.map((g) => "<div class=\"hx-day\" role=\"heading\" aria-level=\"2\">" + escapeHtml(g.day) + "</div><div class=\"hx-group\">" + g.items.join("") + "</div>").join("");
  }

  function renderHistory() {
    const s = $("#section-history");
    const apps = [];
    for (const h of historyEntries) if (h.app && !apps.includes(h.app)) apps.push(h.app);
    if (historyFilter.startsWith("app:") && !apps.includes(historyFilter.slice(4))) historyFilter = "all";
    const attention = historyEntries.filter(historyIsProblem).length;
    if (historyFilter === "attention" && !attention) historyFilter = "all";
    const has = historyEntries.length > 0;
    const chip = (filter, label, count) => "<button type=\"button\" class=\"hx-chip\" data-filter=\"" + escapeAttr(filter) + "\" aria-pressed=\"" + (filter === historyFilter) + "\">" +
      escapeHtml(label) + (count === undefined ? "" : "<span class=\"n\">" + count + "</span>") + "</button>";
    s.innerHTML =
      "<div class=\"hx-head\" data-tauri-drag-region><h1 data-tauri-drag-region>History</h1>" +
      (has ? "<label class=\"search\">" + HX_SEARCH_SVG + "<input id=\"history-search\" type=\"search\" placeholder=\"Search history\" aria-label=\"Search history\" autocomplete=\"off\" spellcheck=\"false\" value=\"" + escapeAttr(historyQuery) + "\"/></label>" : "") + "</div>" +
      "<p class=\"lead\">Your last 50 rewrites, including ones Selara couldn't apply. To undo a replacement, use the app's native undo command.</p>" +
      (has ? "<div class=\"hx-chips\" id=\"history-chips\" role=\"toolbar\" aria-label=\"Filter history\">" + chip("all", "All", historyEntries.length) +
        (attention ? chip("attention", "Needs attention", attention) : "") + apps.map((app) => chip("app:" + app, app)).join("") + "</div>" : "") +
      "<div id=\"history-list\"></div>" +
      "<div class=\"hx-foot\"><p class=\"field-hint\"><span id=\"history-count\">" + historyEntries.length + (historyEntries.length === 1 ? " entry" : " entries") + "</span> · stored on this Mac with the selected text verbatim, readable only by you.</p>" +
      "<button type=\"button\" class=\"btn secondary\" id=\"history-refresh\">Refresh</button>" +
      "<button type=\"button\" class=\"btn danger\" id=\"history-clear\"" + (has ? "" : " disabled") + ">Clear History…</button></div>";
    renderHistoryList();

    const search = $("#history-search");
    if (search) search.addEventListener("input", () => { historyQuery = search.value; renderHistoryList(); });
    const chips = $("#history-chips");
    if (chips) chips.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".hx-chip");
      if (!btn) return;
      historyFilter = btn.dataset.filter;
      renderHistoryList();
    });
    $("#history-refresh").onclick = async () => {
      setStatus("Refreshing history…");
      await refreshHistoryData();
      renderHistory();
      setStatus("History refreshed");
    };
    $("#history-clear").onclick = async () => {
      if (historyClearPending) return;
      historyClearPending = true;
      try {
        if (!(await confirmAction("Clear the history?", "This deletes every saved original and result.", "Clear History"))) return;
        await invoke("history_clear");
        await refreshHistoryData();
        renderHistory();
        setStatus("History cleared");
      } catch (e) {
        setStatus(String(e), "error");
      } finally {
        historyClearPending = false;
      }
    };
    const copyFromHistory = async (h, which) => {
      const ok = await copyText((which === "original" ? h.original : h.result) || "");
      setStatus(ok ? (which === "original" ? "Copied original" : "Copied result") : "Copy failed", ok ? "info" : "error");
    };
    const historyMenu = (h, anchor) => showNativeMenu([
      { text: "Copy Result", action: () => copyFromHistory(h, "result") },
      { text: "Copy Original", enabled: !!h.original, action: () => copyFromHistory(h, "original") },
    ], anchor);
    $("#history-list").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const row = btn.closest(".hist-item");
      const h = historyEntries[Number(row && row.dataset.index)];
      if (!h) return;
      if (btn.dataset.act === "copy-menu") historyMenu(h, btn);
      else await copyFromHistory(h, "result");
    });
    $("#history-list").addEventListener("contextmenu", (ev) => {
      const row = ev.target.closest(".hist-item");
      const h = row && historyEntries[Number(row.dataset.index)];
      if (!h) return;
      ev.preventDefault();
      historyMenu(h);
    });
  }

  // Destructive actions ask with a native alert whose button names the action.
  // Builds without the command (and the DOM tests) fall back to confirm().
  async function confirmAction(title, message, confirmLabel) {
    try {
      const answer = await invoke("confirm_action", { title, message, confirmLabel });
      if (typeof answer === "boolean") return answer;
    } catch (_) { /* fall back below */ }
    return window.confirm(message);
  }

  // Native macOS context/pull-down menu. `items` are { text, action, enabled }
  // or "-" for a separator. Returns false when the menu API is unavailable.
  // Tauri routes menu actions by item id, so every popup gets fresh ids and
  // the previous menu is closed before a new one opens. Otherwise a stale
  // handler with the same id could run for another row's menu.
  let nativeMenuSeq = 0;
  let openNativeMenu = null;
  async function showNativeMenu(items, anchor) {
    const api = window.__TAURI__ && window.__TAURI__.menu;
    if (!api || !api.Menu) return false;
    try {
      if (openNativeMenu && typeof openNativeMenu.close === "function") {
        const previous = openNativeMenu;
        openNativeMenu = null;
        await previous.close().catch(() => {});
      }
      const menuId = ++nativeMenuSeq;
      const menu = await api.Menu.new({
        items: items.map((item, i) => item === "-"
          ? { item: "Separator" }
          : { id: "selara-menu-" + menuId + "-" + i, text: item.text, enabled: item.enabled !== false, action: () => item.action() }),
      });
      openNativeMenu = menu;
      let at;
      const dpi = window.__TAURI__.dpi;
      if (anchor && dpi && dpi.LogicalPosition) {
        const r = anchor.getBoundingClientRect();
        at = new dpi.LogicalPosition(r.left, r.bottom + 4);
      }
      await menu.popup(at);
      return true;
    } catch (e) {
      console.warn("context menu unavailable:", e);
      return false;
    }
  }

  function clearFieldErrors(sectionSelector) {
    document.querySelectorAll(sectionSelector + " .field-error").forEach((note) => note.remove());
    document.querySelectorAll(sectionSelector + " .field-invalid").forEach((el) => el.classList.remove("field-invalid"));
  }

  // Inline error beside the control that failed to save; cleared on success.
  function showFieldError(el, message) {
    const stack = el && (el.closest(".control-stack") || el.closest(".form-row"));
    if (!stack) return;
    let note = stack.querySelector(".field-error");
    if (!message) { if (note) note.remove(); return; }
    if (!note) {
      note = document.createElement("p");
      note.className = "field-hint error field-error";
      note.setAttribute("role", "alert");
      stack.appendChild(note);
    }
    note.textContent = message;
    if (!saveFailureReporting) shakeField(el);
  }

  // Motion behaviors (design 9) shared by every section.
  // Invalid commit: shake once (--motion-shake); Reduce Motion leaves the red
  // outline only. The mark clears as soon as the field is edited again.
  let saveFailureReporting = false;
  function shakeField(el) {
    const target = el && (el.closest(".prompt-field") || el);
    if (!target || !target.classList) return;
    target.classList.remove("field-invalid");
    void target.offsetWidth;
    target.classList.add("field-invalid");
    el.addEventListener("input", () => target.classList.remove("field-invalid"), { once: true });
  }

  // Commit -> inline "✓ Saved" beside the field, fading after --motion-hold.
  // A field commits with a change event (Return, leaving it, toggling); the
  // save requested right after belongs to it. Command edits name their field
  // directly through nextSaveField.
  let lastCommitted = null;
  let nextSaveField = null;
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    if (el && el.matches && el.matches("input, textarea, select")) lastCommitted = { el, at: Date.now() };
  }, true);
  function takeCommittedField() {
    const explicit = nextSaveField;
    nextSaveField = null;
    if (explicit) return explicit;
    const recent = lastCommitted && Date.now() - lastCommitted.at < 1500 ? lastCommitted : null;
    lastCommitted = null;
    if (!recent) return null;
    return { el: recent.el, inline: recent.el.type === "checkbox" || recent.el.type === "radio" };
  }
  function motionMs(name, fallback) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const n = parseFloat(raw);
    return Number.isFinite(n) ? (raw.endsWith("ms") ? n : n * 1000) : fallback;
  }
  function showSavedTick(field, inline) {
    if (!field || !field.isConnected) return;
    let el = field;
    // A hidden <select> behind a segmented control: mark the visible control.
    if (el.offsetWidth < 4 && el.closest(".segmented")) { el = el.closest(".segmented"); inline = true; }
    let tick;
    if (inline) {
      const anchor = (el.type === "checkbox" || el.type === "radio") ? (el.closest("label") || el) : el;
      const host = anchor.tagName === "LABEL" ? anchor : anchor.parentElement;
      if (!host) return;
      tick = Array.from(host.children).find((c) => c.classList.contains("saved-tick"));
      if (!tick) {
        tick = document.createElement("span");
        tick.className = "saved-tick inline";
        if (anchor.tagName === "LABEL") anchor.appendChild(tick); else anchor.after(tick);
      }
    } else {
      const host = el.parentElement;
      if (!host) return;
      host.classList.add("saved-host");
      tick = Array.from(host.children).find((c) => c.classList.contains("saved-tick") && c.dataset.for === (el.id || ""));
      if (!tick) {
        tick = document.createElement("span");
        tick.className = "saved-tick";
        tick.dataset.for = el.id || "";
        host.appendChild(tick);
      }
      const multiline = el.tagName === "TEXTAREA";
      tick.style.top = (multiline ? el.offsetTop + el.offsetHeight - 24 : el.offsetTop + (el.offsetHeight - 18) / 2) + "px";
      tick.style.right = Math.max(0, host.clientWidth - el.offsetLeft - el.offsetWidth + 6) + "px";
    }
    tick.textContent = "✓ Saved";
    tick.setAttribute("aria-hidden", "true");
    tick.classList.remove("show", "fade");
    void tick.offsetWidth;
    tick.classList.add("show");
    clearTimeout(tick._fade);
    clearTimeout(tick._remove);
    tick._fade = setTimeout(() => {
      tick.classList.add("fade");
      tick._remove = setTimeout(() => tick.remove(), motionMs("--motion-panel", 240) * 2.5 + 50);
    }, motionMs("--motion-hold", 1800));
  }

  // WebKit's CSS AccentColor is always the default blue in a WKWebView, while
  // native checkboxes draw in the user's accent. Ask the app for the real
  // color; re-read it when the window regains focus (the user may have just
  // changed it in System Settings) and when the appearance flips.
  // Keep white labels on accent fills unless they drop below the 3:1 WCAG
  // contrast for large text and UI (Yellow, Orange, and Green accents).
  function accentLabelColor(hex) {
    const channel = (i) => {
      const c = parseInt(hex.slice(i, i + 2), 16) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    const luminance = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
    return 1.05 / (luminance + 0.05) < 3 ? "#1d1d1f" : "#ffffff";
  }

  async function applySystemAccent() {
    let hex = null;
    try { hex = await invoke("system_accent_color"); } catch (_) { hex = null; }
    const root = document.documentElement.style;
    if (typeof hex === "string" && /^#[0-9a-f]{6}$/i.test(hex)) {
      root.setProperty("--accent", hex);
      root.setProperty("--on-accent", accentLabelColor(hex));
    } else {
      root.removeProperty("--accent");
      root.removeProperty("--on-accent");
    }
  }
  window.addEventListener("focus", applySystemAccent);
  if (window.matchMedia) {
    const scheme = window.matchMedia("(prefers-color-scheme: dark)");
    if (scheme.addEventListener) scheme.addEventListener("change", applySystemAccent);
  }

  async function load() {
    setStatus("Loading config…");
    applySystemAccent();
    // Before the first await: the startup check fires 10 s after launch and a
    // slow load must not miss it.
    listenForUpdates();
    // Keep the whole Settings surface available while native calls are in
    // flight. In particular, a user can start editing provider fields before
    // a slow account-status response returns.
    renderSettings();
    renderStatus();
    renderUsage();
    let configLoaded = false;
    try {
      const loaded = await invoke("get_config");
      if (!loaded || typeof loaded !== "object") throw new Error("Saved settings were unavailable");
      config = normalizeConfigForUi(loaded);
      config.provider = config.provider || defaultConfig().provider;
      if (providerDraft) config.provider = { ...config.provider, ...providerDraft };
      if (generalDraft) config = { ...config, ...generalDraft };
      configLoadState = "ready";
      configLoadError = "";
      configLoaded = true;
      renderSettings();
      for (const kind of Object.keys(PROVIDERS).filter(isCliProvider)) {
        const saved = config.provider.kind === kind ? config.provider : (config.provider_connections || {})[kind + ":api_key"];
        refreshCliRuntime(kind, saved && saved.cli_binary || "");
      }
      await refreshChatgptStatus();
      await refreshStatusData();
      renderStatus();
      renderModels();
      await refreshHistoryData();
      renderHistory();
      refreshTrySamples();
      await listenForServeChanges();
      setStatus("Loaded");
    } catch (e) {
      const msg = String(e);
      if (!configLoaded) {
        configLoadState = "failed";
        configLoadError = msg;
        renderSettings();
      }
      setStatus(msg, "error");
      if (!configLoaded) {
        $("#section-status").innerHTML =
          "<h1 data-tauri-drag-region>Settings unavailable</h1><p class=\"lead error\">" + escapeHtml(msg) + "</p>" +
          "<p class=\"hint\">Editing is disabled because saved settings could not be loaded. Restart Selara to try again.</p>";
      }
    }
  }

  // Wait briefly for Tauri global bridge
  let tries = 0;
  (function waitApi() {
    if (getInvoke() || tries > 50) {
      load();
      return;
    }
    tries += 1;
    setStatus("Waiting for Tauri… (" + tries + ")");
    setTimeout(waitApi, 100);
  })();
})();
  </script>
</body>
</html>
