[workspace]
resolver = "2"
members = [
  "crates/selara-core",
  "crates/selara-platform",
  "apps/selara",
  "apps/selara-desktop/src-tauri",
]
default-members = ["apps/selara"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
authors = ["Aj Nieves"]
repository = "https://github.com/snowopsdev/selara"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# `clock` only, for the local UTC offset behind the usage "Today" bucket.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "process"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
